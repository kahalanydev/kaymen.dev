\r\n    background: linear-gradient(135deg, #22c55e, #16a34a);\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: center;\r\n    color: #fff;\r\n    font-size: 1.1rem;\r\n    font-weight: 300;\r\n    line-height: 1;\r\n    box-shadow: 0 4px 12px rgba(34,197,94,0.4);\r\n}\r\n.mockup-kartov .m-tab.active { background: #22c55e; }\r\n\r\n/* Temani Chacham â€” siddur phone */\r\n.m-zmanim-bar {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 6px;\r\n    padding: 6px;\r\n    border-radius: 6px;\r\n    background: rgba(212,160,23,0.08);\r\n    border: 1px solid rgba(212,160,23,0.15);\r\n    margin-bottom: 8px;\r\n}\r\n.m-zman { flex: 1; height: 8px; border-radius: 2px; background: rgba(212,160,23,0.25); }\r\n.m-compass { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(212,160,23,0.5); position: relative; flex-shrink: 0; }\r\n.m-compass::after { content: ''; position: absolute; top: 2px; left: 50%; width: 2px; height: 6px; background: #d4a017; transform: translateX(-50%); border-radius: 1px; }\r\n.m-siddur-body { flex: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; overflow: hidden; }\r\n.m-siddur-h { height: 8px; width: 45%; border-radius: 2px; background: rgba(212,160,23,0.3); margin: 4px 0; }\r\n.m-siddur-body .m-line { background: rgba(255,255,255,0.1); margin-bottom: 0; }\r\n.m-siddur-body .m-line.gold { background: rgba(212,160,23,0.4); }\r\n.mockup-temani .m-tab.active { background: #d4a017; }\r\n\r\n/* MSP Metrics â€” dashboard bars + status list */\r\n.m-bars {\r\n    flex: 1;\r\n    display: flex;\r\n    align-items: flex-end;\r\n    gap: 5px;\r\n    padding: 8px;\r\n    border-radius: 6px;\r\n    background: rgba(255,255,255,0.02);\r\n    border: 1px solid rgba(255,255,255,0.04);\r\n    min-height: 60px;\r\n}\r\n.m-bar { flex: 1; border-radius: 3px 3px 0 0; background: rgba(6,182,212,0.4); }\r\n.m-bar.ok { background: rgba(34,197,94,0.45); }\r\n.m-bar.warn { background: rgba(245,158,11,0.45); }\r\n.m-status-list { width: 42%; display: flex; flex-direction: column; gap: 5px; }\r\n.m-status-row {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 6px;\r\n    padding: 5px 6px;\r\n    border-radius: 5px;\r\n    background: rgba(255,255,255,0.03);\r\n    border: 1px solid rgba(255,255,255,0.04);\r\n}\r\n.m-status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }\r\n.m-status-dot.ok { background: #22c55e; }\r\n.m-status-dot.warn { background: #f59e0b; }\r\n.m-status-dot.bad { background: #ef4444; }\r\n\r\n/* Richmount Capital â€” marketing hero */\r\n.mockup-richmount .m-main.full { display: flex; flex-direction: column; }\r\n.m-rc-hero {\r\n    flex: 1;\r\n    display: flex;\r\n    flex-direction: column;\r\n    align-items: center;\r\n    justify-content: center;\r\n    gap: 8px;\r\n    padding: 16px;\r\n    background: linear-gradient(180deg, rgba(201,162,39,0.08) 0%, transparent 100%);\r\n}\r\n.m-rc-title { height: 14px; width: 65%; border-radius: 4px; background: rgba(255,255,255,0.14); }\r\n.m-rc-sub { height: 6px; width: 80%; border-radius: 2px; background: rgba(255,255,255,0.06); }\r\n.m-rc-cta { height: 18px; width: 72px; border-radius: 5px; background: linear-gradient(135deg, #c9a227, #9a7b1a); }\r\n.m-rc-row { display: flex; gap: 8px; padding: 12px; }\r\n.m-rc-card { flex: 1; height: 46px; border-radius: 6px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }\r\n\r\n/* OLAMI Herzliya â€” app (event ticket + auto check-in) */\r\n.m-ticket-banner { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; background: rgba(180,31,81,0.1); border: 1px solid rgba(180,31,81,0.25); margin-bottom: 8px; }\r\n.m-ticket-dot { width: 10px; height: 10px; border-radius: 50%; background: #B41F51; box-shadow: 0 0 6px rgba(180,31,81,0.6); flex-shrink: 0; }\r\n.m-ticket-lines { flex: 1; }\r\n.m-ticket-badge { width: 16px; height: 16px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }\r\n.m-dot.magenta { background: #B41F51; }\r\n.mockup-olami-app .m-tab.active { background: #B41F51; }\r\n\r\n/* --- CAPABILITIES --- */\r\n.capabilities {\r\n    background: var(--bg-elevated);\r\n    border-top: 1px solid var(--border);\r\n    border-bottom: 1px solid var(--border);\r\n}\r\n.caps-grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(3, 1fr);\r\n    gap: 24px;\r\n}\r\n.cap-card {\r\n    padding: 32px;\r\n    background: var(--bg);\r\n    border: 1px solid var(--border);\r\n    border-radius: var(--radius);\r\n    transition: var(--transition);\r\n}\r\n.cap-card:hover {\r\n    border-color: var(--border-light);\r\n    transform: translateY(-2px);\r\n}\r\n.cap-icon {\r\n    width: 48px;\r\n    height: 48px;\r\n    border-radius: 12px;\r\n    background: rgba(255,255,255,0.03);\r\n    border: 1px solid rgba(255,255,255,0.06);\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: center;\r\n    margin-bottom: 20px;\r\n    color: var(--accent, #3b82f6);\r\n}\r\n.cap-icon svg { width: 24px; height: 24px; }\r\n\r\n.cap-card h3 {\r\n    font-size: 1.1rem;\r\n    font-weight: 600;\r\n    margin-bottom: 8px;\r\n}\r\n.cap-card p {\r\n    color: var(--text-secondary);\r\n    font-size: 0.88rem;\r\n    line-height: 1.6;\r\n    margin-bottom: 16px;\r\n}\r\n.cap-techs {\r\n    display: flex;\r\n    flex-wrap: wrap;\r\n    gap: 6px;\r\n}\r\n.cap-techs span {\r\n    font-size: 0.7rem;\r\n    padding: 3px 8px;\r\n    border-radius: 4px;\r\n    background: var(--bg-elevated);\r\n    color: var(--text-muted);\r\n    font-family: var(--mono);\r\n}\r\n\r\n/* --- PROCESS --- */\r\n.process-steps {\r\n    max-width: 700px;\r\n    margin: 0 auto;\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 0;\r\n    position: relative;\r\n}\r\n.process-steps::before {\r\n    content: '';\r\n    position: absolute;\r\n    left: 35px;\r\n    top: 24px;\r\n    bottom: 24px;\r\n    width: 1px;\r\n    background: linear-gradient(to bottom, var(--accent), var(--border));\r\n}\r\n.process-step {\r\n    display: flex;\r\n    gap: 32px;\r\n    padding: 28px 0;\r\n    position: relative;\r\n}\r\n.step-num {\r\n    font-family: var(--mono);\r\n    font-size: 1.4rem;\r\n    font-weight: 700;\r\n    color: var(--accent);\r\n    min-width: 48px;\r\n    position: relative;\r\n    z-index: 1;\r\n    background: var(--bg);\r\n    padding: 4px 0;\r\n}\r\n.step-content h3 {\r\n    font-size: 1.2rem;\r\n    font-weight: 600;\r\n    margin-bottom: 8px;\r\n}\r\n.step-content p {\r\n    color: var(--text-secondary);\r\n    font-size: 0.95rem;\r\n    line-height: 1.6;\r\n}\r\n\r\n/* --- CONTACT --- */\r\n.contact {\r\n    padding-bottom: 80px;\r\n}\r\n.contact-card {\r\n    background: var(--bg-card);\r\n    border: 1px solid var(--border);\r\n    border-radius: 20px;\r\n    padding: 64px;\r\n    display: grid;\r\n    grid-template-columns: 1fr 1fr;\r\n    gap: 64px;\r\n    align-items: center;\r\n    position: relative;\r\n    overflow: hidden;\r\n}\r\n.contact-card::before {\r\n    content: '';\r\n    position: absolute;\r\n    top: 0;\r\n    right: 0;\r\n    width: 400px;\r\n    height: 400px;\r\n    background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);\r\n}\r\n.contact-content { position: relative; }\r\n.contact-content .section-tag { margin-bottom: 16px; }\r\n.contact-content h2 {\r\n    font-size: 2.5rem;\r\n    font-weight: 700;\r\n    letter-spacing: -0.02em;\r\n    line-height: 1.2;\r\n    margin-bottom: 16px;\r\n}\r\n.contact-content p {\r\n    color: var(--text-secondary);\r\n    font-size: 1rem;\r\n    line-height: 1.7;\r\n    margin-bottom: 32px;\r\n}\r\n.contact-methods {\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 12px;\r\n}\r\n.contact-method {\r\n    display: inline-flex;\r\n    align-items: center;\r\n    gap: 16px;\r\n    padding: 16px 24px;\r\n    border-radius: var(--radius);\r\n    border: 1px solid var(--border);\r\n    background: var(--bg);\r\n    transition: var(--transition);\r\n    max-width: fit-content;\r\n}\r\n.contact-method:hover { border-color: var(--accent); background: var(--accent-glow); }\r\n.contact-method svg { width: 24px; height: 24px; color: var(--accent); flex-shrink: 0; }\r\n.contact-label {\r\n    display: block;\r\n    font-size: 0.75rem;\r\n    color: var(--text-muted);\r\n    text-transform: uppercase;\r\n    letter-spacing: 0.08em;\r\n}\r\n.contact-value {\r\n    display: block;\r\n    font-weight: 500;\r\n    font-size: 0.95rem;\r\n}\r\n\r\n/* Idea form */\r\n.idea-form { margin-bottom: 24px; }\r\n.idea-form .form-group { margin-bottom: 16px; }\r\n.idea-form label {\r\n    display: block;\r\n    font-size: 0.8rem;\r\n    color: var(--text-secondary);\r\n    text-transform: uppercase;\r\n    letter-spacing: 0.06em;\r\n    margin-bottom: 6px;\r\n}\r\n.idea-form input, .idea-form textarea {\r\n    width: 100%;\r\n    padding: 12px 16px;\r\n    background: var(--bg);\r\n    border: 1px solid var(--border);\r\n    border-radius: var(--radius-sm);\r\n    color: var(--text);\r\n    font-family: var(--font);\r\n    font-size: 0.95rem;\r\n    transition: var(--transition);\r\n    outline: none;\r\n}\r\n.idea-form input:focus, .idea-form textarea:focus {\r\n    border-color: var(--accent);\r\n    box-shadow: 0 0 0 3px var(--accent-glow);\r\n}\r\n.idea-form textarea { resize: vertical; min-height: 100px; }\r\n.idea-form .btn { margin-top: 4px; }\r\n#ideaMsg { margin-top: 12px; }\r\n#ideaMsg .success-msg {\r\n    color: #22c55e;\r\n    font-size: 0.9rem;\r\n    padding: 12px 16px;\r\n    background: rgba(34, 197, 94, 0.1);\r\n    border-radius: var(--radius-sm);\r\n    border: 1px solid rgba(34, 197, 94, 0.2);\r\n}\r\n#ideaMsg .error-msg {\r\n    color: #ef4444;\r\n    font-size: 0.9rem;\r\n    padding: 12px 16px;\r\n    background: rgba(239, 68, 68, 0.1);\r\n    border-radius: var(--radius-sm);\r\n    border: 1px solid rgba(239, 68, 68, 0.2);\r\n}\r\n.contact-divider {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 16px;\r\n    margin-bottom: 20px;\r\n    color: var(--text-muted);\r\n    font-size: 0.8rem;\r\n    text-transform: uppercase;\r\n    letter-spacing: 0.1em;\r\n}\r\n.contact-divider::before, .contact-divider::after {\r\n    content: '';\r\n    flex: 1;\r\n    height: 1px;\r\n    background: var(--border);\r\n}\r\n\r\n/* Code block visual */\r\n.contact-visual { position: relative; }\r\n.code-block {\r\n    background: #0d1117;\r\n    border: 1px solid var(--border);\r\n    border-radius: var(--radius);\r\n    overflow: hidden;\r\n    font-family: var(--mono);\r\n    font-size: 0.85rem;\r\n}\r\n.code-header {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 8px;\r\n    padding: 12px 16px;\r\n    border-bottom: 1px solid var(--border);\r\n    background: rgba(255,255,255,0.02);\r\n}\r\n.code-dot {\r\n    width: 10px;\r\n    height: 10px;\r\n    border-radius: 50%;\r\n    background: var(--border-light);\r\n}\r\n.code-dot:nth-child(1) { background: #ef4444; }\r\n.code-dot:nth-child(2) { background: #f59e0b; }\r\n.code-dot:nth-child(3) { background: #22c55e; }\r\n.code-title {\r\n    margin-left: 8px;\r\n    font-size: 0.75rem;\r\n    color: var(--text-muted);\r\n}\r\n.code-block pre {\r\n    padding: 20px;\r\n    line-height: 1.8;\r\n    overflow-x: auto;\r\n}\r\n.code-block code { color: #e6edf3; }\r\n.code-kw { color: #ff7b72; }\r\n.code-var { color: #79c0ff; }\r\n.code-key { color: #d2a8ff; }\r\n.code-str { color: #a5d6ff; }\r\n.code-fn { color: #d2a8ff; }\r\n.code-bool { color: #ff7b72; }\r\n\r\n/* --- FOOTER --- */\r\n.footer {\r\n    border-top: 1px solid var(--border);\r\n    padding: 32px 0;\r\n}\r\n.footer-inner {\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: space-between;\r\n}\r\n.footer-logo {\r\n    font-family: var(--mono);\r\n    font-size: 0.9rem;\r\n    color: var(--text-muted);\r\n}\r\n.footer-links {\r\n    display: flex;\r\n    gap: 24px;\r\n}\r\n.footer-links a {\r\n    font-size: 0.85rem;\r\n    color: var(--text-muted);\r\n    transition: var(--transition);\r\n}\r\n.footer-links a:hover { color: var(--text); }\r\n.footer-copy {\r\n    font-size: 0.8rem;\r\n    color: var(--text-muted);\r\n}\r\n\r\n/* --- ANIMATIONS --- */\r\n.fade-in {\r\n    opacity: 0;\r\n    transform: translateY(30px);\r\n    transition: opacity 0.8s ease, transform 0.8s ease;\r\n}\r\n.fade-in.visible {\r\n    opacity: 1;\r\n    transform: translateY(0);\r\n}\r\n\r\n/* --- RESPONSIVE --- */\r\n@media (max-width: 1024px) {\r\n    .projects-grid { grid-template-columns: 1fr; }\r\n    .caps-grid { grid-template-columns: repeat(2, 1fr); }\r\n    .contact-card {\r\n        grid-template-columns: 1fr;\r\n        padding: 48px;\r\n    }\r\n}\r\n\r\n@media (max-width: 768px) {\r\n    .nav-links { display: none; }\r\n    .nav-links.open {\r\n        display: flex;\r\n        flex-direction: column;\r\n        position: fixed;\r\n        top: 0;\r\n        left: 0;\r\n        right: 0;\r\n        bottom: 0;\r\n        background: rgba(9, 9, 11, 0.98);\r\n        backdrop-filter: blur(20px);\r\n        justify-content: center;\r\n        align-items: center;\r\n        gap: 24px;\r\n        z-index: 999;\r\n    }\r\n    .nav-links.open a {\r\n        font-size: 1.5rem;\r\n        color: var(--text);\r\n    }\r\n    .nav-hamburger { display: flex; z-index: 1001; }\r\n\r\n    .hero { padding: 100px 20px 60px; min-height: 100svh; }\r\n    .hero h1 { font-size: 2.4rem; }\r\n    .hero-stats { gap: 24px; }\r\n    .stat-num { font-size: 2rem; }\r\n    .hero-scroll { display: none; }\r\n\r\n    .section { padding: 80px 0; }\r\n    .section-header { margin-bottom: 40px; }\r\n\r\n    .caps-grid { grid-template-columns: 1fr; }\r\n\r\n    .mockup-screen { height: 200px; }\r\n    .phone-frame { width: 160px; height: 300px; }\r\n\r\n    .contact-card { padding: 32px; gap: 40px; }\r\n    .contact-content h2 { font-size: 2rem; }\r\n    .contact-visual { display: none; }\r\n\r\n    .footer-inner {\r\n        flex-direction: column;\r\n        gap: 16px;\r\n        text-align: center;\r\n    }\r\n\r\n    .process-steps::before { left: 20px; }\r\n    .step-num { font-size: 1.1rem; min-width: 36px; }\r\n    .process-step { gap: 20px; }\r\n}\r\n\r\n@media (max-width: 480px) {\r\n    .hero h1 { font-size: 2rem; }\r\n    .hero-stats {\r\n        flex-direction: column;\r\n        gap: 16px;\r\n    }\r\n    .stat-divider {\r\n        width: 40px;\r\n        height: 1px;\r\n    }\r\n    .hero-actions {\r\n        flex-direction: column;\r\n        align-items: stretch;\r\n    }\r\n    .btn { justify-content: center; }\r\n    .project-body { padding: 20px; }\r\n    .cap-card { padding: 24px; }\r\n    .m-sidebar { width: 40px; }\r\n    .mockup-screen { height: 180px; }\r\n    .m-content-row { flex-direction: column; }\r\n    .m-table { width: 100%; }\r\n}\r\n\r\n/* ============================================================================\r\n   POSITIONING REBUILD Ã¢â‚¬â€ evidence strip, practice areas, case studies\r\n   ----------------------------------------------------------------------------\r\n   Added alongside the removal of the 19-card grid. These sections are\r\n   server-rendered from content/projects.js; markup lives in server/render.js.\r\n   ============================================================================ */\r\n\r\n.hero-kicker {\r\n    font-size: 0.95rem;\r\n    color: var(--text-muted);\r\n    max-width: 620px;\r\n    margin: 20px auto 0;\r\n    padding-top: 20px;\r\n    border-top: 1px solid var(--border);\r\n    line-height: 1.6;\r\n}\r\n\r\n/* --- Evidence strip -------------------------------------------------------- */\r\n\r\n.evidence {\r\n    padding: 56px 0;\r\n    border-top: 1px solid var(--border);\r\n    border-bottom: 1px solid var(--border);\r\n    background: var(--bg-elevated);\r\n}\r\n.evidence-grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(4, 1fr);\r\n    gap: 32px;\r\n}\r\n.evidence-item {\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 4px;\r\n    padding-left: 20px;\r\n    border-left: 2px solid var(--border-light);\r\n}\r\n.evidence-value {\r\n    font-family: var(--mono);\r\n    font-size: 2rem;\r\n    font-weight: 500;\r\n    line-height: 1.1;\r\n    color: var(--text);\r\n}\r\n.evidence-label {\r\n    font-size: 0.9rem;\r\n    font-weight: 600;\r\n    color: var(--text);\r\n}\r\n.evidence-note {\r\n    font-size: 0.82rem;\r\n    color: var(--text-muted);\r\n    line-height: 1.5;\r\n}\r\n\r\n/* --- Practice areas -------------------------------------------------------- */\r\n\r\n.practice-grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(3, 1fr);\r\n    gap: 24px;\r\n}\r\n.practice-card {\r\n    display: flex;\r\n    flex-direction: column;\r\n    padding: 32px;\r\n    background: var(--bg-card);\r\n    border: 1px solid var(--border);\r\n    border-radius: var(--radius);\r\n    transition: var(--transition);\r\n}\r\n.practice-card:hover {\r\n    border-color: var(--border-light);\r\n    background: var(--bg-card-hover);\r\n}\r\n.practice-label {\r\n    font-family: var(--mono);\r\n    font-size: 0.72rem;\r\n    letter-spacing: 0.12em;\r\n    text-transform: uppercase;\r\n    color: var(--accent);\r\n    margin-bottom: 14px;\r\n}\r\n.practice-card h3 {\r\n    font-size: 1.4rem;\r\n    font-weight: 700;\r\n    letter-spacing: -0.02em;\r\n    margin-bottom: 14px;\r\n}\r\n.practice-promise {\r\n    font-size: 1rem;\r\n    color: var(--text-secondary);\r\n    line-height: 1.65;\r\n    margin-bottom: 16px;\r\n}\r\n.practice-detail {\r\n    font-size: 0.9rem;\r\n    color: var(--text-muted);\r\n    line-height: 1.7;\r\n    margin-bottom: 24px;\r\n}\r\n.practice-proof {\r\n    list-style: none;\r\n    margin: 0 0 24px;\r\n    padding: 20px 0 0;\r\n    border-top: 1px solid var(--border);\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 10px;\r\n}\r\n.practice-proof li {\r\n    position: relative;\r\n    padding-left: 22px;\r\n    font-size: 0.88rem;\r\n    color: var(--text-secondary);\r\n    line-height: 1.55;\r\n}\r\n.practice-proof li::before {\r\n    content: \"\";\r\n    position: absolute;\r\n    left: 0;\r\n    top: 0.52em;\r\n    width: 8px;\r\n    height: 8px;\r\n    border-radius: 2px;\r\n    background: var(--accent);\r\n    opacity: 0.65;\r\n}\r\n.practice-stack {\r\n    margin-top: auto;\r\n    display: flex;\r\n    flex-wrap: wrap;\r\n    gap: 6px;\r\n}\r\n.practice-stack span {\r\n    font-family: var(--mono);\r\n    font-size: 0.7rem;\r\n    padding: 4px 8px;\r\n    border-radius: var(--radius-xs);\r\n    background: var(--bg-elevated);\r\n    border: 1px solid var(--border);\r\n    color: var(--text-muted);\r\n}\r\n\r\n/* --- Case study cards ------------------------------------------------------ */\r\n\r\n.study-grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(3, 1fr);\r\n    gap: 24px;\r\n}\r\n.study-card {\r\n    background: var(--bg-card);\r\n    border: 1px solid var(--border);\r\n    border-radius: var(--radius);\r\n    overflow: hidden;\r\n    transition: var(--transition);\r\n}\r\n.study-card:hover {\r\n    border-color: var(--accent);\r\n    transform: translateY(-3px);\r\n    box-shadow: 0 12px 32px -12px var(--accent-glow);\r\n}\r\n.study-card-link {\r\n    display: flex;\r\n    flex-direction: column;\r\n    height: 100%;\r\n    padding: 28px;\r\n    text-decoration: none;\r\n    color: inherit;\r\n}\r\n.study-card-head {\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: space-between;\r\n    gap: 12px;\r\n    margin-bottom: 18px;\r\n}\r\n.study-area {\r\n    font-family: var(--mono);\r\n    font-size: 0.7rem;\r\n    letter-spacing: 0.1em;\r\n    text-transform: uppercase;\r\n    color: var(--accent);\r\n}\r\n.study-status {\r\n    font-size: 0.72rem;\r\n    padding: 3px 9px;\r\n    border-radius: 100px;\r\n    background: var(--bg-elevated);\r\n    border: 1px solid var(--border);\r\n    color: var(--text-muted);\r\n    white-space: nowrap;\r\n}\r\n.study-card h3 {\r\n    font-size: 1.3rem;\r\n    font-weight: 700;\r\n    letter-spacing: -0.02em;\r\n    line-height: 1.25;\r\n    margin-bottom: 10px;\r\n}\r\n.study-tagline {\r\n    font-size: 0.95rem;\r\n    color: var(--text-secondary);\r\n    line-height: 1.6;\r\n    margin-bottom: 22px;\r\n}\r\n.study-scale {\r\n    display: flex;\r\n    flex-wrap: wrap;\r\n    gap: 24px;\r\n    padding: 18px 0;\r\n    border-top: 1px solid var(--border);\r\n    border-bottom: 1px solid var(--border);\r\n    margin-bottom: 18px;\r\n}\r\n.study-scale > div {\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 2px;\r\n}\r\n.scale-value {\r\n    font-family: var(--mono);\r\n    font-size: 1.25rem;\r\n    font-weight: 500;\r\n    color: var(--text);\r\n    line-height: 1.1;\r\n}\r\n.scale-label {\r\n    font-size: 0.75rem;\r\n    color: var(--text-muted);\r\n    line-height: 1.4;\r\n}\r\n.study-hard {\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 5px;\r\n    padding: 14px 16px;\r\n    border-radius: var(--radius-sm);\r\n    background: var(--bg-elevated);\r\n    border-left: 2px solid var(--accent);\r\n    margin-bottom: 20px;\r\n}\r\n.study-hard-tag {\r\n    font-family: var(--mono);\r\n    font-size: 0.65rem;\r\n    letter-spacing: 0.12em;\r\n    text-transform: uppercase;\r\n    color: var(--text-muted);\r\n}\r\n.study-hard-title {\r\n    font-size: 0.92rem;\r\n    font-weight: 600;\r\n    color: var(--text);\r\n    line-height: 1.45;\r\n}\r\n.study-more {\r\n    margin-top: auto;\r\n    display: inline-flex;\r\n    align-items: center;\r\n    gap: 6px;\r\n    font-size: 0.85rem;\r\n    font-weight: 600;\r\n    color: var(--accent);\r\n}\r\n.study-more svg { transition: var(--transition); }\r\n.study-card:hover .study-more svg { transform: translateX(3px); }\r\n\r\n/* --- Long tail ------------------------------------------------------------- */\r\n\r\n/* Sits directly under the case-study grid, which already has its own bottom\r\n   padding — so this one only needs to separate itself from the next section. */\r\n.more-work { padding: 0 0 24px; }\r\n.more-toggle {\r\n    border: 1px solid var(--border);\r\n    border-radius: var(--radius);\r\n    background: var(--bg-card);\r\n}\r\n.more-toggle summary {\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: space-between;\r\n    gap: 16px;\r\n    padding: 22px 28px;\r\n    cursor: pointer;\r\n    list-style: none;\r\n    transition: var(--transition);\r\n}\r\n.more-toggle summary::-webkit-details-marker { display: none; }\r\n.more-toggle summary:hover { background: var(--bg-card-hover); }\r\n.more-summary-text {\r\n    font-size: 1.05rem;\r\n    font-weight: 600;\r\n}\r\n.more-summary-text::before {\r\n    content: \"+\";\r\n    display: inline-block;\r\n    width: 20px;\r\n    font-family: var(--mono);\r\n    color: var(--accent);\r\n}\r\n.more-toggle[open] .more-summary-text::before { content: \"\\2212\"; }\r\n.more-count {\r\n    font-family: var(--mono);\r\n    font-size: 0.8rem;\r\n    color: var(--text-muted);\r\n}\r\n.more-grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(3, 1fr);\r\n    gap: 32px;\r\n    padding: 8px 28px 0;\r\n    border-top: 1px solid var(--border);\r\n}\r\n.more-col h4 {\r\n    font-size: 0.78rem;\r\n    letter-spacing: 0.1em;\r\n    text-transform: uppercase;\r\n    color: var(--text-muted);\r\n    margin: 24px 0 14px;\r\n}\r\n.more-col ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }\r\n.more-col li { display: flex; flex-direction: column; gap: 2px; }\r\n.more-name {\r\n    font-size: 0.92rem;\r\n    font-weight: 600;\r\n    color: var(--text);\r\n    display: inline-flex;\r\n    align-items: center;\r\n    gap: 8px;\r\n}\r\n.more-name a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border-light); }\r\n.more-name a:hover { color: var(--accent); border-color: var(--accent); }\r\n.more-badge {\r\n    font-size: 0.62rem;\r\n    letter-spacing: 0.06em;\r\n    text-transform: uppercase;\r\n    padding: 2px 6px;\r\n    border-radius: 100px;\r\n    background: var(--accent-glow);\r\n    color: var(--accent);\r\n    font-weight: 700;\r\n}\r\n.more-note { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }\r\n.more-footnote {\r\n    padding: 28px;\r\n    margin-top: 8px;\r\n    font-size: 0.82rem;\r\n    color: var(--text-muted);\r\n    line-height: 1.6;\r\n    border-top: 1px solid var(--border);\r\n}\r\n\r\n/* ============================================================================\r\n   CASE STUDY PAGES  (/work and /work/<slug>)\r\n   ============================================================================ */\r\n\r\n.case-narrow { max-width: 760px; }\r\n\r\n.work-hero, .case-hero {\r\n    padding: 160px 0 64px;\r\n    border-bottom: 1px solid var(--border);\r\n    position: relative;\r\n}\r\n.work-hero { text-align: center; }\r\n.work-hero h1, .case-hero h1 {\r\n    font-size: clamp(2.1rem, 5vw, 3.2rem);\r\n    font-weight: 800;\r\n    letter-spacing: -0.035em;\r\n    line-height: 1.1;\r\n    margin: 18px 0;\r\n}\r\n.work-hero h1 em { font-style: italic; color: var(--accent); }\r\n.work-hero p {\r\n    font-size: 1.05rem;\r\n    color: var(--text-secondary);\r\n    line-height: 1.7;\r\n    max-width: 640px;\r\n    margin: 0 auto;\r\n}\r\n.work-index { padding-top: 80px; }\r\n.notfound-hero .hero-actions { justify-content: center; margin-top: 32px; }\r\n\r\n.case-back {\r\n    display: inline-flex;\r\n    align-items: center;\r\n    gap: 6px;\r\n    font-size: 0.85rem;\r\n    color: var(--text-muted);\r\n    text-decoration: none;\r\n    margin-bottom: 28px;\r\n    transition: var(--transition);\r\n}\r\n.case-back:hover { color: var(--accent); }\r\n.case-meta {\r\n    display: flex;\r\n    align-items: center;\r\n    flex-wrap: wrap;\r\n    gap: 8px;\r\n    font-family: var(--mono);\r\n    font-size: 0.75rem;\r\n    letter-spacing: 0.06em;\r\n    text-transform: uppercase;\r\n    color: var(--text-muted);\r\n}\r\n.case-meta .case-area { color: var(--accent); }\r\n.case-dot { opacity: 0.4; }\r\n.case-tagline {\r\n    font-size: 1.25rem;\r\n    font-weight: 500;\r\n    color: var(--text);\r\n    line-height: 1.5;\r\n    margin-bottom: 20px;\r\n}\r\n.case-summary {\r\n    font-size: 1rem;\r\n    color: var(--text-secondary);\r\n    line-height: 1.75;\r\n}\r\n.case-live { margin-top: 24px; display: inline-flex; align-items: center; gap: 8px; }\r\n.case-scale {\r\n    display: flex;\r\n    flex-wrap: wrap;\r\n    gap: 40px;\r\n    margin-top: 40px;\r\n    padding-top: 28px;\r\n    border-top: 1px solid var(--border);\r\n}\r\n.case-scale-item { display: flex; flex-direction: column; gap: 3px; }\r\n.case-scale-value {\r\n    font-family: var(--mono);\r\n    font-size: 1.6rem;\r\n    font-weight: 500;\r\n    line-height: 1.1;\r\n    color: var(--text);\r\n}\r\n.case-scale-label { font-size: 0.8rem; color: var(--text-muted); }\r\n\r\n.case-body { padding: 72px 24px 40px; }\r\n.case-section { margin-bottom: 64px; }\r\n.case-section h2 {\r\n    display: flex;\r\n    align-items: baseline;\r\n    gap: 14px;\r\n    font-size: 1.5rem;\r\n    font-weight: 700;\r\n    letter-spacing: -0.02em;\r\n    margin-bottom: 22px;\r\n}\r\n.case-num {\r\n    font-family: var(--mono);\r\n    font-size: 0.8rem;\r\n    font-weight: 400;\r\n    color: var(--accent);\r\n    opacity: 0.7;\r\n}\r\n.case-section p {\r\n    font-size: 1.02rem;\r\n    color: var(--text-secondary);\r\n    line-height: 1.8;\r\n    margin-bottom: 18px;\r\n}\r\n.case-section p strong { color: var(--text); font-weight: 600; }\r\n.case-section code {\r\n    font-family: var(--mono);\r\n    font-size: 0.88em;\r\n    padding: 2px 6px;\r\n    border-radius: var(--radius-xs);\r\n    background: var(--bg-elevated);\r\n    border: 1px solid var(--border);\r\n    color: var(--text);\r\n}\r\n.case-list { list-style: none; display: flex; flex-direction: column; gap: 14px; }\r\n.case-list li {\r\n    position: relative;\r\n    padding-left: 26px;\r\n    font-size: 1rem;\r\n    color: var(--text-secondary);\r\n    line-height: 1.7;\r\n}\r\n.case-list li::before {\r\n    content: \"\";\r\n    position: absolute;\r\n    left: 2px;\r\n    top: 0.62em;\r\n    width: 8px;\r\n    height: 8px;\r\n    border-radius: 2px;\r\n    background: var(--border-light);\r\n}\r\n.case-list-check li::before { background: var(--accent); opacity: 0.7; }\r\n\r\n/* The hard part Ã¢â‚¬â€ deliberately the most visually distinct block on the page. */\r\n.case-hard {\r\n    padding: 36px;\r\n    margin: 0 -36px 64px;\r\n    border-radius: var(--radius);\r\n    background: var(--bg-card);\r\n    border: 1px solid var(--border);\r\n    border-left: 3px solid var(--accent);\r\n}\r\n.case-hard-tag {\r\n    font-family: var(--mono);\r\n    font-size: 0.7rem;\r\n    letter-spacing: 0.14em;\r\n    text-transform: uppercase;\r\n    color: var(--accent);\r\n    margin-bottom: 12px;\r\n}\r\n.case-hard h2 { display: block; font-size: 1.65rem; margin-bottom: 24px; }\r\n.case-lesson {\r\n    margin-top: 28px;\r\n    padding: 20px 22px;\r\n    border-radius: var(--radius-sm);\r\n    background: var(--bg-elevated);\r\n    border: 1px solid var(--border);\r\n}\r\n.case-lesson-label {\r\n    display: block;\r\n    font-family: var(--mono);\r\n    font-size: 0.68rem;\r\n    letter-spacing: 0.12em;\r\n    text-transform: uppercase;\r\n    color: var(--text-muted);\r\n    margin-bottom: 8px;\r\n}\r\n.case-lesson p { margin: 0; font-size: 0.96rem; color: var(--text); line-height: 1.7; }\r\n\r\n.case-stack { display: flex; flex-wrap: wrap; gap: 8px; }\r\n.case-stack span {\r\n    font-family: var(--mono);\r\n    font-size: 0.78rem;\r\n    padding: 6px 12px;\r\n    border-radius: var(--radius-xs);\r\n    background: var(--bg-card);\r\n    border: 1px solid var(--border);\r\n    color: var(--text-secondary);\r\n}\r\n\r\n.case-nav { border-top: 1px solid var(--border); }\r\n.case-nav-inner {\r\n    display: flex;\r\n    justify-content: space-between;\r\n    gap: 24px;\r\n    padding: 32px 24px;\r\n}\r\n.case-nav-item {\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 4px;\r\n    text-decoration: none;\r\n    max-width: 45%;\r\n    transition: var(--transition);\r\n}\r\n.case-nav-item.next { text-align: right; margin-left: auto; }\r\n.case-nav-dir {\r\n    font-family: var(--mono);\r\n    font-size: 0.7rem;\r\n    letter-spacing: 0.1em;\r\n    text-transform: uppercase;\r\n    color: var(--text-muted);\r\n}\r\n.case-nav-name { font-size: 0.98rem; font-weight: 600; color: var(--text); line-height: 1.4; }\r\n.case-nav-item:hover .case-nav-name { color: var(--accent); }\r\n\r\n/* --- Shared closing CTA ---------------------------------------------------- */\r\n\r\n.cta-band { padding: 96px 0; border-top: 1px solid var(--border); background: var(--bg-elevated); }\r\n.cta-band-inner { text-align: center; max-width: 640px; margin: 0 auto; }\r\n.cta-band h2 {\r\n    font-size: clamp(1.6rem, 3.5vw, 2.2rem);\r\n    font-weight: 800;\r\n    letter-spacing: -0.03em;\r\n    margin-bottom: 14px;\r\n}\r\n.cta-band p { color: var(--text-secondary); line-height: 1.7; margin-bottom: 28px; }\r\n.cta-band-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }\r\n\r\n/* --- Responsive ------------------------------------------------------------ */\r\n\r\n@media (max-width: 1024px) {\r\n    .evidence-grid { grid-template-columns: repeat(2, 1fr); gap: 28px; }\r\n    .practice-grid { grid-template-columns: 1fr; }\r\n    .study-grid { grid-template-columns: repeat(2, 1fr); }\r\n    .more-grid { grid-template-columns: repeat(2, 1fr); }\r\n}\r\n\r\n@media (max-width: 768px) {\r\n    .evidence { padding: 40px 0; }\r\n    .evidence-grid { grid-template-columns: 1fr 1fr; gap: 24px; }\r\n    .evidence-value { font-size: 1.6rem; }\r\n    .study-grid { grid-template-columns: 1fr; }\r\n    .more-grid { grid-template-columns: 1fr; padding: 8px 20px 0; }\r\n    .more-toggle summary { padding: 18px 20px; }\r\n    .more-footnote { padding: 20px; }\r\n    .work-hero, .case-hero { padding: 120px 0 48px; }\r\n    .case-body { padding: 48px 24px 32px; }\r\n    .case-hard { margin: 0 0 48px; padding: 24px; }\r\n    .case-scale { gap: 24px; }\r\n    .case-nav-inner { flex-direction: column; }\r\n    .case-nav-item { max-width: 100%; }\r\n    .case-nav-item.next { text-align: left; margin-left: 0; }\r\n    .hero-kicker { font-size: 0.88rem; }\r\n}\r\n\n/* ============================================================================\n   CASE STUDY â€” demo-led layout\n   ----------------------------------------------------------------------------\n   The demo is the centrepiece and sits directly under the hero. Prose is\n   scannable by default and the full write-up lives behind a disclosure, so the\n   page reads in 30 seconds and rewards depth if you want it.\n   ============================================================================ */\n\n/* Demo breaks out wider than the 760px prose column. */\n.case-body > .demo { margin-left: -60px; margin-right: -60px; }\n\n/* --- at a glance ----------------------------------------------------------- */\n\n.case-glance {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 36px;\n    padding: 8px 0 44px;\n    margin-bottom: 44px;\n    border-bottom: 1px solid var(--border);\n}\n.case-glance h2 {\n    font-size: 0.74rem;\n    font-family: var(--mono);\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--text-muted);\n    margin-bottom: 16px;\n}\n.glance-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }\n.glance-list li {\n    position: relative;\n    padding-left: 20px;\n    font-size: 0.93rem;\n    color: var(--text-secondary);\n    line-height: 1.6;\n}\n.glance-list li::before {\n    content: '';\n    position: absolute;\n    left: 0;\n    top: 0.6em;\n    width: 6px;\n    height: 6px;\n    border-radius: 2px;\n    background: var(--border-light);\n}\n.glance-check li::before { background: var(--accent); opacity: 0.75; }\n\n/* --- outcome --------------------------------------------------------------- */\n\n.case-outcome { margin-bottom: 44px; }\n.case-outcome h2 {\n    font-size: 0.74rem;\n    font-family: var(--mono);\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: var(--text-muted);\n    margin-bottom: 18px;\n}\n.case-outcome .case-stack { margin-top: 26px; }\n\n/* --- full write-up disclosure ---------------------------------------------- */\n\n.case-longform {\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    background: var(--bg-card);\n    margin-bottom: 8px;\n}\n.case-longform summary {\n    display: flex;\n    flex-direction: column;\n    gap: 3px;\n    padding: 20px 24px;\n    cursor: pointer;\n    list-style: none;\n    transition: var(--transition);\n}\n.case-longform summary::-webkit-details-marker { display: none; }\n.case-longform summary:hover { background: var(--bg-card-hover); }\n.lf-title { font-size: 1.02rem; font-weight: 600; color: var(--text); }\n.lf-title::before {\n    content: '+';\n    display: inline-block;\n    width: 20px;\n    font-family: var(--mono);\n    color: var(--accent);\n}\n.case-longform[open] .lf-title::before { content: '\\2212'; }\n.lf-sub { font-size: 0.83rem; color: var(--text-muted); padding-left: 20px; }\n.lf-body { padding: 8px 24px 28px; border-top: 1px solid var(--border); }\n.lf-body .case-section { margin: 32px 0 0; }\n.lf-body .case-section h3 {\n    display: flex;\n    align-items: baseline;\n    gap: 12px;\n    font-size: 1.2rem;\n    font-weight: 700;\n    letter-spacing: -0.02em;\n    margin-bottom: 16px;\n}\n.lf-body .case-hard { margin: 32px 0 0; padding: 26px; }\n.lf-body .case-hard h3 { display: block; font-size: 1.3rem; margin-bottom: 18px; }\n\n/* --- study card demo hook ---------------------------------- ine-height: 1.7;\n}\n.demo-caption code, .demo-caption em { color: var(--text); }\n.demo-caption code { font-family: var(--mono); font-size: 0.86em; }\n.demo-caption em { font-style: normal; font-weight: 600; }\n.demo-failed { display: none; }\n\n/* --- switches -------------------------------------------------------------- */\n\n.demo-switch { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }\n.demo-switch button {\n    flex: 1 1 0;\n    min-width: 150px;\n    display: flex;\n    flex-direction: column;\n    gap: 3px;\n    text-align: left;\n    padding: 12px 15px;\n    border-radius: var(--radius-sm);\n    border: 1px solid var(--border);\n    background: var(--bg-elevated);\n    color: var(--text-muted);\n    font: inherit;\n    cursor: pointer;\n    transition: var(--transition);\n}\n.demo-switch button:hover { border-color: var(--border-light); color: var(--text-secondary); }\n.demo-switch button[aria-pressed=\"true\"] {\n    border-color: var(--accent);\n    background: var(--accent-glow);\n    color: var(--text);\n}\n.sw-name { font-size: 0.95rem; font-weight: 600; }\n.demo-switch button[aria-pressed=\"true\"] .sw-name { color: var(--text); }\n.sw-sub { font-family: var(--mono); font-size: 0.68rem; color: var(--text-muted); }\n\n.demo-action {\n    display: inline-block;\n    font-family: var(--mono);\n    font-size: 0.82rem;\n    padding: 11px 18px;\n    border-radius: var(--radius-sm);\n    border: 1px solid var(--accent);\n    background: var(--accent-glow);\n    color: var(--accent);\n    cursor: pointer;\n    transition: var(--transition);\n    margin-bottom: 18px;\n}\n.demo-action:hover { background: var(--accent); color: #fff; }\n\n/* --- console / table ------------------------------------------------------- */\n\n.demo-console {\n    border: 1px solid var(--border);\n    border-radius: var(--radius-sm);\n    overflow: hidden;\n    background: var(--bg-elevated);\n}\n.demo-console-bar {\n    display: flex;\n    align-items: center;\n    border: 0;\n    background: var(--bg-card-hover);\n    color: var(--text-secondary);\n    font-size: 1.1rem;\n    cursor: pointer;\n    transition: var(--transition);\n}\n.demo-stepper button:hover { background: var(--accent); color: #fff; }\n.demo-stepper code {\n    flex: 1;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-family: var(--mono);\n    font-size: 0.95rem;\n    color: var(--text);\n    padding: 10px 6px;\n}\n\n.demo-terminal {\n    display: none;\n    padding: 14px 16px;\n    border-radius: var(--radius-sm);\n    border: 1px solid var(--border);\n    background: #0a0a0c;\n    font-family: var(--mono);\n    font-size: 0.76rem;\n    line-height: 1.75;\n    white-space: pre-wrap;\n    margin-bottom: 18px;\n    color: #d4d4d8;\n}\n.demo-terminal.is-on { display: block; }\n.demo-terminal .t-dim { color: #71717a; }\n.demo-terminal .t-ok { color: #22c55e; }\n.demo-terminal .t-hi { color: #eab308; }\n\n.demo-reach { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }\n.demo-reach-label { font-size: 0.82rem; color: var(--text-muted); flex: 1 1 180px; }\n.demo-reach-bar {\n    flex: 2 1 180px;\n    height: 10px;\n    border-radius: 100px;\n    background: var(--bg-elevated);\n    border: 1px solid var(--border);\n    overflow: hidden;\n}\n.demo-reach-bar span { display: block; height: 100%; width: 0; transition: width .4s cubic-bezier(.4,0,.2,1); }\n.demo-reach-bar span.good { background: #22c55e; }\n.demo-reach-bar span.bad { background: #ef4444; }\n.demo-reach-value { font-family: var(--mono); font-size: 1.1rem; font-variant-numeric: tabular-nums; }\n.demo-reach-value.good { color: #22c55e; }\n.demo-reach-value.bad { color: #ef4444; }\n\n/* --- progress (ingest) ------------------------------------------------------ */\n\n.demo-progress {\n    height: 10px;\n    border-radius: 100px;\n    background: var(--bg-elevated);\n    border: 1px solid var(--border);\n    overflow: hidden;\n}\n.demo-progress span { d const SITE_JS = "// ============================================\r\n// KAHALANY.DEV — Portfolio Site Scripts\r\n// ============================================\r\n\r\ndocument.addEventListener('DOMContentLoaded', () => {\r\n    // --- NAV SCROLL ---\r\n    const nav = document.getElementById('nav');\r\n    if (nav) {\r\n        window.addEventListener('scroll', () => {\r\n            nav.classList.toggle('scrolled', window.scrollY > 50);\r\n        }, { passive: true });\r\n    }\r\n\r\n    // --- HAMBURGER ---\r\n    const hamburger = document.getElementById('hamburger');\r\n    const navLinks = document.getElementById('navLinks');\r\n    if (hamburger && navLinks) {\r\n        hamburger.addEventListener('click', () => {\r\n            hamburger.classList.toggle('open');\r\n            navLinks.classList.toggle('open');\r\n            document.body.style.overflow = navLinks.classList.contains('open') ? 'hidden' : '';\r\n        });\r\n        navLinks.querySelectorAll('a').forEach(a => {\r\n            a.addEventListener('click', () => {\r\n                hamburger.classList.remove('open');\r\n                navLinks.classList.remove('open');\r\n                document.body.style.overflow = '';\r\n            });\r\n        });\r\n    }\r\n\r\n    // --- COUNTER ANIMATION ---\r\n    const counters = document.querySelectorAll('.stat-num[data-count]');\r\n    const counterObserver = new IntersectionObserver((entries) => {\r\n        entries.forEach(entry => {\r\n            if (!entry.isIntersecting) return;\r\n            const el = entry.target;\r\n            const target = parseInt(el.dataset.count);\r\n            const duration = 1500;\r\n            const start = performance.now();\r\n            const animate = (now) => {\r\n                const progress = Math.min((now - start) / duration, 1);\r\n                const eased = 1 - Math.pow(1 - progress, 3);\r\n                el.textContent = Math.round(target * eased);\r\n                if (progress < 1) requestAnimationFrame(animate);\r\n            };\r\n            requestAnimationFrame(animate);\r\n            counterObserver.unobserve(el);\r\n        });\r\n    }, { threshold: 0.5 });\r\n    counters.forEach(c => counterObserver.observe(c));\r\n\r\n    // --- ROTATING HERO TEXT ---\r\n    // Homepage-only. Without this guard the null deref threw before the theme\r\n    // toggle below was ever wired, silently breaking it on /work and every\r\n    // case study page.\r\n    const el = document.getElementById('rotatingText');\r\n    if (el) {\r\n        const words = ['holds up', 'scales', 'stays fixed', 'lasts'];\r\n        let wordIndex = 0;\r\n        setInterval(() => {\r\n            el.style.opacity = '0';\r\n            el.style.transform = 'translateY(10px)';\r\n            setTimeout(() => {\r\n                wordIndex = (wordIndex + 1) % words.length;\r\n                el.textContent = words[wordIndex];\r\n                el.style.opacity = '1';\r\n                el.style.transform = 'translateY(0)';\r\n            }, 300);\r\n        }, 2500);\r\n        el.style.transition = 'opacity 0.3s ease, transform 0.3s ease';\r\n        el.style.display = 'inline-block';\r\n    }\r\n\r\n    // --- SCROLL ANIMATIONS ---\r\n    const fadeEls = document.querySelectorAll(\r\n        '.study-card, .practice-card, .evidence-item, .process-step, .contact-card, .section-header'\r\n    );\r\n    fadeEls.forEach(el => el.classList.add('fade-in'));\r\n    const fadeObserver = new IntersectionObserver((entries) => {\r\n        entries.forEach(entry => {\r\n            if (entry.isIntersecting) {\r\n                entry.target.classList.add('visible');\r\n                fadeObserver.unobserve(entry.target);\r\n            }\r\n        });\r\n    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });\r\n    fadeEls.forEach(el => fadeObserver.observe(el));\r\n\r\n    // (Project filter bar removed 2026-08-13 — the 19-card grid it drove is gone.)\r\n\r\n    // --- SMOOTH SCROLL FOR ANCHOR LINKS ---\r\n    document.querySelectorAll('a[href^=\"#\"]').forEach(a => {\r\n        a.addEventListener('click', (e) => {\r\n            const target = document.querySelector(a.getAttribute('href'));\r\n            if (target) {\r\n                e.preventDefault();\r\n                target.scrollIntoView({ behavior: 'smooth' });\r\n            }\r\n        });\r\n    });\r\n\r\n    // --- IDEA FORM ---\r\n    const ideaForm = document.getElementById('ideaForm');\r\n    const _ft = Date.now();\r\n    if (ideaForm) {\r\n        ideaForm.addEventListener('submit', async (e) => {\r\n            e.preventDefault();\r\n            const btn = document.getElementById('ideaSubmitBtn');\r\n            const msg = document.getElementById('ideaMsg');\r\n            btn.textContent = 'Sending...'; btn.disabled = true;\r\n            try {\r\n                const res = await fetch('/api/contact', {\r\n                    method: 'POST',\r\n                    headers: { 'Content-Type': 'application/json' },\r\n                    body: JSON.stringify({\r\n                        name: document.getElementById('ideaName').value,\r\n                        email: document.getElementById('ideaEmail').value,\r\n                        project_name: document.getElementById('ideaProject').value,\r\n                        message: document.getElementById('ideaText').value,\r\n                        _hp: document.getElementById('ideaWebsite').value,\r\n                        _t: Date.now() - _ft\r\n                    })\r\n                });\r\n                const data = await res.json();\r\n                if (!res.ok) throw new Error(data.error || 'Failed to send');\r\n                msg.innerHTML = '<div class=\"success-msg\">Message sent! We\\'ll get back to you within 24 hours.</div>';\r\n                ideaForm.reset();\r\n            } catch (err) {\r\n                msg.innerHTML = '<div class=\"error-msg\">' + err.message + '</div>';\r\n            }\r\n            btn.textContent = 'Send It Over'; btn.disabled = false;\r\n        });\r\n    }\r\n\r\n    // --- THEME TOGGLE ---\r\n    const saved = localStorage.getItem('theme');\r\n    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');\r\n\r\n    const toggle = document.getElementById('themeToggle');\r\n    if (toggle) {\r\n        toggle.addEventListener('click', () => {\r\n            const isLight = document.documentElement.getAttribute('data-theme') === 'light';\r\n            if (isLight) {\r\n                document.documentElement.removeAttribute('data-theme');\r\n                localStorage.setItem('theme', 'dark');\r\n            } else {\r\n                document.documentElement.setAttribute('data-theme', 'light');\r\n                localStorage.setItem('theme', 'light');\r\n            }\r\n        });\r\n    }\r\n});\r\n\n;\n/* ============================================================================\n   Interactive case-study demos.\n\n   One IIFE, no dependencies, no build step. Each demo boots from its\n   [data-demo] container so a page carrying none of them costs nothing.\n\n   All data is synthetic. These illustrate a mechanism; they never display a\n   real record.\n   ============================================================================ */\n(function () {\n  'use strict';\n\n  const $ = (root, sel) => root.querySelector(sel);\n  const $$ = (root, sel) => Array.from(root.querySelectorAll(sel));\n  const out = (root, name) => root.querySelector(`[data-out=\"${name}\"]`);\n\n  /** Wire an aria-pressed button group; calls back with the chosen value. */\n  function group(root, attr, onPick) {\n    const btns = $$(root, `button[data-${attr}]`);\n    btns.forEach((b) =>\n      b.addEventListener('click', () => {\n        btns.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));\n        onPick(b.dataset[attr]);\n      })\n    );\n    return btns;\n  }\n\n  const money = (n) =>\n    '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n\n  /* --- 1. RLS ------------------------------------------------------------- */\n\n  function rls(root) {\n    // Synthetic roster. Four campuses, deliberately generic names.\n    const ROWS = [\n      ['Dana Ellis', 'Campus A'], ['Samir Okonkwo', 'Campus A'],\n      ['Noa Bergman', 'Campus B'], ['Toby Fletcher', 'Campus C'],\n      ['Priya Raman', 'Campus A'], ['Marcus Hale', 'Campus D'],\n      ['Lior Adler', 'Campus B'], ['Erin Vasquez', 'Campus C'],\n    ];\n\n    function render(role) {\n      const isSuper = role === 'super';\n      const rows = isSuper ? ROWS : ROWS.filter((r) => r[1] === 'Campus A');\n\n      out(root, 'user').textContent = isSuper ? 'thrive' : 'thrive_app';\n      out(root, 'rolsuper').textContent = String(isSuper);\n      out(root, 'rolsuper').className = isSuper ? 'bad' : 'good';\n      out(root, 'count').textContent = String(rows.length);\n\n      out(root, 'rows').innerHTML = rows\n        .map(\n          ([name, campus]) => `<tr class=\"${campus === 'Campus A' ? '' : 'foreign'}\">\n            <td>${name}</td><td><span class=\"campus\">${campus}</span></td>\n            <td>${campus === 'Campus A' ? '' : '<span class=\"leak\">should not be visible</span>'}</td>\n          </tr>`\n        )\n        .join('');\n\n      const v = out(root, 'verdict');\n      v.className = 'demo-verdict ' + (isSuper ? 'bad' : 'good');\n      v.innerHTML = isSuper\n        ? '<strong>Isolation is off.</strong> Superusers bypass row-level security unconditionally. Four campuses in one result set, no error, no warning — and every policy on the table is correct.'\n        : '<strong>Policy enforced.</strong> Identical query, identical policies. The only thing that changed is that the connecting role is not a superuser.';\n    }\n\n    group(root, 'role', render);\n    render('super');\n  }\n\n  /* --- 2. Fund basis ------------------------------------------------------ */\n\n  function fund(root) {\n    const ON_LOAN = 1_204_260.4;\n    const CASH = 402_273.46;\n    const UNDISTRIBUTED = 20_000.0;\n    const DONATED = 921_400.2;\n    const BORROWED = 712_517.36;\n\n    const HELD = ON_LOAN + CASH - UNDISTRIBUTED;   // 1,586,533.86\n    const IN = DONATED + BORROWED;                  // 1,633,917.56\n    const GAP = IN - HELD;                          // 47,383.70\n\n    const SETS = {\n      in: {\n        total: IN,\n        bars: [\n          { label: 'Donated outright', value: DONATED, tone: 'a' },\n          { label: 'Lent to the fund by 44 people', value: BORROWED, tone: 'b' },\n        ],\n      },\n      held: {\n        total: HELD,\n        bars: [\n          { label: 'Out on loan', value: ON_LOAN, tone: 'a' },\n          { label: 'Cash in the bank', value: CASH, tone: 'b' },\n          { label: 'Grants still to distribute', value: -UNDISTRIBUTED, tone: 'neg' },\n        ],\n      },\n    };\n\n    let raf = null;\n    function animateTo(target) {\n      const el = out(root, 'total');\n      const from = Number(String(el.dataset.v || target));\n      const start = performance.now();\n      cancelAnimationFrame(raf);\n      (function tick(now) {\n        const t = Math.min(1, (now - start) / 520);\n        const e = 1 - Math.pow(1 - t, 3);\n        const v = from + (target - from) * e;\n        el.textContent = money(v);\n        if (t < 1) raf = requestAnimationFrame(tick);\n        else el.dataset.v = String(target);\n      })(start);\n      el.dataset.v = el.dataset.v || String(target);\n    }\n\n    function render(basis) {\n      const set = SETS[basis];\n      animateTo(set.total);\n\n      const max = Math.max(...set.bars.map((b) => Math.abs(b.value)));\n      out(root, 'bars').innerHTML = set.bars\n        .map(\n          (b) => `<div class=\"demo-bar ${b.tone}\">\n            <span class=\"demo-bar-label\">${b.label}</span>\n            <span class=\"demo-bar-track\"><i style=\"width:${(Math.abs(b.value) / max) * 100}%\"></i></span>\n            <span class=\"demo-bar-value\">${b.value < 0 ? '−' : ''}${money(Math.abs(b.value))}</span>\n          </div>`\n        )\n        .join('');\n\n      const gap = out(root, 'gap');\n      gap.className = 'demo-gap ' + (basis === 'in' ? 'bad' : 'good');\n      gap.innerHTML =\n        basis === 'in'\n          ? `<span class=\"demo-gap-value\">${money(GAP)}</span>\n             <span class=\"demo-gap-text\"><strong>reported as “unexplained difference”</strong> — four years of bank fees, write-offs and running costs that left the bank and never came off the total.</span>`\n          : `<span class=\"demo-gap-value\">${money(GAP)}</span>\n             <span class=\"demo-gap-text\"><strong>now reported as “spent”</strong> — the figure reconciles to the bank with no remainder, and needs no expense record to be correct.</span>`;\n    }\n\n    group(root, 'basis', render);\n    out(root, 'total').dataset.v = String(IN);\n    render('in');\n  }\n\n  /* --- 3. Slot horizon ---------------------------------------------------- */\n\n  function horizon(root) {\n    const WINDOW = 30;         // rolling days the generator was meant to keep filled\n    const slider = $(root, 'input[type=range]');\n    const alertOn = $(root, '[data-fix=\"alert\"]');\n    const jobOn = $(root, '[data-fix=\"job\"]');\n\n    function render() {\n      const day = Number(slider.value);\n      // Detection and repair are deliberately separate: with only the daily job\n      // enabled the window never empties, so the alarm would never be exercised\n      // and the second half of the lesson would be unreachable.\n      const detecting = alertOn.checked;\n      const fixed = jobOn.checked;\n      // Without the daily job the generated horizon shrinks as time advances.\n      const remaining = fixed ? WINDOW : Math.max(0, WINDOW - day);\n      const empty = remaining === 0;\n\n      out(root, 'day').textContent = String(day);\n      out(root, 'slots').innerHTML = empty\n        ? '<strong>0 bookable slots</strong> — the booking page shows no availability'\n        : `<strong>${remaining * 4} bookable slots</strong> across the next ${remaining} days`;\n\n      out(root, 'calendar').innerHTML = Array.from({ length: WINDOW }, (_, i) => {\n        const filled = i < remaining;\n        return `<span class=\"cal-day${filled ? ' filled' : ''}\"></span>`;\n      }).join('');\n\n      const status = out(root, 'status');\n      const alerts = out(root, 'alerts');\n      const errors = out(root, 'errors');\n\n      if (empty && detecting) {\n        status.textContent = 'HEALTHCHECK FAIL';\n        status.className = 'demo-pill bad';\n        alerts.textContent = '1 alert';\n        alerts.className = 'demo-pill bad';\n      } else {\n        status.textContent = '200 OK';\n        status.className = 'demo-pill ok';\n        alerts.textContent = '0 alerts';\n        alerts.className = 'demo-pill quiet';\n      }\n      // The request never fails in any branch — that is the entire point.\n      errors.textContent = '0 errors';\n      errors.className = 'demo-pill quiet';\n\n      const v = out(root, 'verdict');\n      if (fixed && detecting) {\n        v.className = 'demo-verdict good';\n        v.innerHTML =\n          '<strong>Both halves in place.</strong> The daily job keeps the window extended, and the health check has to prove there is availability rather than being trusted because nothing crashed.';\n      } else if (fixed) {\n        v.className = 'demo-verdict';\n        v.innerHTML =\n          '<strong>Repaired, but still undetectable.</strong> The horizon no longer runs dry — but nothing here would tell you if it started to again. Fixing the cause without adding the alarm just resets the clock.';\n      } else if (empty && detecting) {\n        v.className = 'demo-verdict good';\n        v.innerHTML =\n          '<strong>Caught.</strong> Same empty calendar, same 200 response — but the check now asserts there is availability, so the absence itself is the alert.';\n      } else if (empty) {\n        v.className = 'demo-verdict bad';\n        v.innerHTML =\n          '<strong>Dry — and completely silent.</strong> No exception, no failed request, no alert that could have fired. The only symptom is an absence of bookings, which looks exactly like a quiet week.';\n      } else {\n        v.className = 'demo-verdict';\n        v.innerHTML = `The generated window shrinks by one day, every day. <strong>${remaining} days of runway left.</strong>`;\n      }\n    }\n\n    slider.addEventListener('input', render);\n    alertOn.addEventListener('change', render);\n    jobOn.addEventListener('change', render);\n    render();\n  }\n\n  /* --- 4. OTA runtime ----------------------------------------------------- */\n\n  function ota(root) {\n    const VERSIONS = ['2.0.0', '2.0.1', '2.1.0', '2.2.0'];\n    const state = { config: 2, store: 1 };\n\n    function render(published) {\n      out(root, 'config').textContent = VERSIONS[state.config];\n      out(root, 'store').textContent = VERSIONS[state.store];\n      const match = state.config === state.store;\n\n      const term = out(root, 'terminal');\n      if (published) {\n        term.innerHTML = `<span class=\"t-dim\">$ eas update --branch production</span>\n<span class=\"t-dim\">  Bundling JavaScript…                    done</span>\n<span class=\"t-dim\">  Uploading assets…                       done</span>\n<span class=\"t-dim\">  Runtime version</span> <span class=\"t-hi\">${VERSIONS[state.config]}</span>\n<span class=\"t-ok\">✔ Published! Update group created.</span>\n<span class=\"t-dim\">  https://expo.dev/…/updates/8f2c1a</span>`;\n        term.classList.add('is-on');\n      }\n\n      const pct = match ? 100 : 0;\n      out(root, 'reach').textContent = pct + '%';\n      out(root, 'reach').className = 'demo-reach-value ' + (match ? 'good' : 'bad');\n      const bar = out(root, 'reachbar');\n      bar.style.width = pct + '%';\n      bar.className = match ? 'good' : 'bad';\n\n      if (published) {\n        const note = document.createElement('div');\n        note.className = 'demo-verdict ' + (match ? 'good' : 'bad');\n        note.innerHTML = match\n          ? '<strong>Delivered.</strong> The published runtime matches the binary people actually have installed.'\n          : `<strong>Published successfully to nobody.</strong> The command exited zero and the dashboard shows the update. No installed device runs runtime ${VERSIONS[state.config]}, so every user stays on the old code — indefinitely, and silently.`;\n        const old = $(root, '.demo-verdict');\n        if (old) old.remove();\n        root.querySelector('.demo-body').appendChild(note);\n      }\n    }\n\n    $$(root, 'button[data-step]').forEach((b) =>\n      b.addEventListener('click', () => {\n        const [key, delta] = b.dataset.step.split(':');\n        state[key] = Math.max(0, Math.min(VERSIONS.length - 1, state[key] + Number(delta)));\n        const old = $(root, '.demo-verdict');\n        if (old) old.remove();\n        render(false);\n      })\n    );\n    $(root, '[data-publish]').addEventListener('click', () => render(true));\n    render(false);\n  }\n\n  /* --- 5. Ingestion ceiling ----------------------------------------------- */\n\n  function ingest(root) {\n    const slider = $(root, 'input[type=range]');\n    const PER_MONTH = 2615;     // synthetic, but proportionate to ~243k lifetime\n    const CEILING = 60000;      // where an unbounded query stops returning at all\n    let mode = 'naive';\n    let timer = null;\n\n    function render() {\n      const months = Number(slider.value);\n      const rows = months * PER_MONTH;\n      out(root, 'window').textContent =\n        months >= 12 ? `${(months / 12).toFixed(months % 12 ? 1 : 0)} years` : `${months} months`;\n      out(root, 'rows').textContent = rows.toLocaleString('en-US');\n\n      const bar = out(root, 'bar');\n      const v = out(root, 'verdict');\n      const short = out(root, 'verdictShort');\n      clearTimeout(timer);\n\n      if (mode === 'naive' && rows > CEILING) {\n        bar.style.width = '100%';\n        bar.className = 'bad';\n        short.textContent = 'timeout';\n        short.className = 'bad';\n        v.className = 'demo-verdict bad';\n        v.innerHTML =\n          '<strong>504 — and zero rows returned.</strong> Not a slow response: no partial result, no cursor, no way to resume. Ask for more history and you get strictly less data than asking for less.';\n      } else if (mode === 'naive') {\n        bar.style.width = Math.min(100, (rows / CEILING) * 100) + '%';\n        bar.className = 'warn';\n        short.textContent = 'ok';\n        short.className = 'good';\n        v.className = 'demo-verdict';\n        v.innerHTML = `Fits — for now. <strong>${Math.round((rows / CEILING) * 100)}% of the way to the ceiling</strong>, which nothing in the API tells you about until you cross it.`;\n      } else {\n        bar.style.width = '0%';\n        bar.className = 'good';\n        short.textContent = 'resumable';\n        short.className = 'good';\n        v.className = 'demo-verdict good';\n        v.innerHTML =\n          '<strong>Bounded, then incremental.</strong> A fixed-start backfill makes the initial load finite and resumable; delta sync on last-activity keeps it fresh. Extending history later clears one row of sync state instead of re-running the import.';\n        // Fill the bar to show the backfill completing.\n        requestAnimationFrame(() => { bar.style.width = '100%'; });\n      }\n    }\n\n    group(root, 'mode', (m) => { mode = m; render(); });\n    slider.addEventListener('input', render);\n    render();\n  }\n\n  /* --- 6. Task id correlation --------------------------------------------- */\n\n  function taskid(root) {\n    const TOTAL = 5;\n    let keying = 'naive';\n    let timers = [];\n\n    function reset() {\n      timers.forEach(clearTimeout);\n      timers = [];\n      out(root, 'stream').innerHTML = '';\n      out(root, 'done').textContent = '0';\n      out(root, 'total').textContent = String(TOTAL);\n      out(root, 'panelbar').style.width = '0%';\n      out(root, 'dropped').innerHTML = '';\n      out(root, 'dropped').className = 'demo-dropped';\n    }\n\n    function line(html, cls) {\n      const el = document.createElement('div');\n      el.className = 'ev ' + (cls || '');\n      el.innerHTML = html;\n      out(root, 'stream').appendChild(el);\n      const s = out(root, 'stream');\n      s.scrollTop = s.scrollHeight;\n    }\n\n    function run() {\n      reset();\n      let done = 0;\n      let dropped = 0;\n      const fixed = keying === 'fixed';\n\n      for (let i = 0; i < TOTAL; i++) {\n        const callId = `call_${(i + 1).toString().padStart(2, '0')}`;\n        const taskId = `t_${88 + i}`;\n\n        timers.push(setTimeout(() => {\n          line(`<span class=\"ev-k\">tool_use</span> TaskCreate <span class=\"ev-id\">${callId}</span>`);\n        }, i * 620));\n\n        timers.push(setTimeout(() => {\n          line(`<span class=\"ev-k res\">tool_result</span> { taskId: <span class=\"ev-id hi\">${taskId}</span> }`);\n        }, i * 620 + 210));\n\n        timers.push(setTimeout(() => {\n          if (fixed) {\n            done++;\n            out(root, 'done').textContent = String(done);\n            out(root, 'panelbar').style.width = (done / TOTAL) * 100 + '%';\n            line(`<span class=\"ev-k upd\">TaskUpdate</span> <span class=\"ev-id hi\">${taskId}</span> → matched <span class=\"ok\">✓</span>`, 'ok');\n          } else {\n            dropped++;\n            line(`<span class=\"ev-k upd\">TaskUpdate</span> <span class=\"ev-id\">${taskId}</span> → no such key <span class=\"drop\">dropped</span>`, 'drop');\n            const d = out(root, 'dropped');\n            d.className = 'demo-dropped is-on';\n            d.innerHTML = `<strong>${dropped}</strong> update${dropped > 1 ? 's' : ''} discarded — keyed on <code>${'call_..'}</code>, arrived as <code>t_..</code>`;\n          }\n        }, i * 620 + 430));\n      }\n\n      timers.push(setTimeout(() => {\n        if (!fixed) {\n          out(root, 'done').textContent = String(TOTAL);\n          out(root, 'panelbar').style.width = '100%';\n          line(`<span class=\"ev-k end\">turn end</span> panel jumps 0 → ${TOTAL}`, 'late');\n        }\n      }, TOTAL * 620 + 700));\n    }\n\n    group(root, 'key', (k) => { keying = k; reset(); });\n    $(root, '[data-run]').addEventListener('click', run);\n    reset();\n  }\n\n  /* --- boot ---------------------------------------------------------------- */\n\n  const BOOT = { rls, fund, horizon, ota, ingest, taskid };\n\n  function init() {\n    document.querySelectorAll('[data-demo]').forEach((el) => {\n      const fn = BOOT[el.dataset.demo];\n      if (!fn || el.dataset.booted) return;\n      el.dataset.booted = '1';\n      try {\n        fn(el);\n      } catch (err) {\n        // A broken demo must never take the page with it.\n        el.classList.add('demo-failed');\n        console.error(`[demo:${el.dataset.demo}]`, err);\n      }\n    });\n  }\n\n  if (document.readyState === 'loading') {\n    document.addEventListener('DOMContentLoaded', init);\n  } else {\n    init();\n  }\n})();\n";
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));

let theme = 'dark';

// Build the page switcher, grouped.
let lastGroup = null;
for (const p of PAGES) {
  if (p.group !== lastGroup) {
    const g = document.createElement('span');
    g.className = 'grp'; g.textContent = p.group;
    nav.appendChild(g); lastGroup = p.group;
  }
  const b = document.createElement('button');
  b.textContent = p.label; b.dataset.id = p.id;
  b.onclick = () => show(p.id);
  nav.appendChild(b);
}

function show(id) {
  const p = byId[id];
  if (!p) return;
  current = id;
  pathEl.textContent = p.path;
  nav.querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.id === id)));
  // Function replacements: CSS and JS can contain $& / $', which are special
  // when a replacement is passed as a string.
  view.srcdoc = p.html
    .replace('<!--STYLE-->', () => '<style>' + SITE_CSS + '<\/style>')
    .replace('<!--SCRIPT-->', () => '<script>' + SITE_JS + '<\/script>');
}

// Internal links inside the preview drive the switcher instead of 404ing.
// srcdoc inherits the parent origin, so the document is reachable.
view.addEventListener('load', () => {
  const doc = view.contentDocument;
  if (!doc) return;
  applyTheme();
  doc.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a');
    if (!a) return;
    const href = a.getAttribute('href') || '';
    if (href.startsWith('http') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
    const hit = PAGES.find(p => p.path === href.split('#')[0]) ||
                (href.startsWith('#') ? null : PAGES.find(p => p.path === href));
    if (hit) { e.preventDefault(); show(hit.id); return; }
    if (href.startsWith('/#') ) {           // cross-page anchor -> home + hash
      e.preventDefault();
      show('home');
      const hash = href.slice(1);
      setTimeout(() => {
        const t = view.contentDocument.querySelector(hash);
        if (t) t.scrollIntoView({ behavior: 'smooth' });
      }, 120);
      return;
    }
    if (href === '/' ) { e.preventDefault(); show('home'); }
  });
});

function applyTheme() {
  const doc = view.contentDocument;
  if (!doc) return;
  if (theme === 'light') doc.documentElement.setAttribute('data-theme', 'light');
  else doc.documentElement.removeAttribute('data-theme');
}

document.getElementById('widths').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  frame.style.maxWidth = b.dataset.w;
  [...e.currentTarget.children].forEach(x => x.setAttribute('aria-current', String(x === b)));
};
document.getElementById('themes').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  theme = b.dataset.t;
  [...e.currentTarget.children].forEach(x => x.setAttribute('aria-current', String(x === b)));
  applyTheme();
};

show('home');
</script>
</body>
</html>
