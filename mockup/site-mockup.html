ss=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><circle cx=\"12\" cy=\"12\" r=\"5\"/><path d=\"M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\"/></svg>\n                <svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><path d=\"M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z\"/></svg>\n            </button>\n            <button class=\"nav-hamburger\" id=\"hamburger\" aria-label=\"Toggle menu\">\n                <span></span><span></span><span></span>\n            </button>\n        </div>\n    </nav>\n\n    <article class=\"case\">\n        <header class=\"case-hero\">\n            <div class=\"container case-narrow\">\n                <a class=\"case-back\" href=\"/work\" data-track=\"case-back\">\n                    <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z\"/></svg>\n                    All work\n                </a>\n                <div class=\"case-meta\">\n                    <span class=\"case-area\">Multi-tenant platforms</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-status\">Live in production</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-year\">2026</span>\n                </div>\n                <h1>Community lending ledger</h1>\n                <p class=\"case-tagline\">A $1.58M interest-free loan fund whose headline number was wrong by $47,383.</p>\n                <p class=\"case-summary\">An interest-free community loan fund ran on spreadsheets, contracts in Google Drive, and a bookkeeping tool with no transaction export. We built the ledger — and in the process found that the number everyone quoted was measuring the wrong side of the balance sheet.</p>\n                \n                <div class=\"case-scale\">\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">$1.58M</span>\n                        <span class=\"case-scale-label\">fund reconciled to the bank</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">44</span>\n                        <span class=\"case-scale-label\">lenders tracked individually</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">$47K</span>\n                        <span class=\"case-scale-label\">previously-unexplained gap, resolved</span>\n                    </div>\n                </div>\n            </div>\n        </header>\n\n        <div class=\"container case-narrow case-body\">\n            <figure class=\"demo\" data-demo=\"fund\">\n    <figcaption class=\"demo-head\">\n        <span class=\"demo-tag\">Interactive — try it</span>\n        <h3 class=\"demo-title\">One fund. Two definitions. A $47,383 gap.</h3>\n        <p class=\"demo-kicker\">Switch which side of the balance sheet the headline number is counted from.</p>\n    </figcaption>\n    <div class=\"demo-body\">\n    <div class=\"demo-switch wide\" role=\"group\" aria-label=\"Counting basis\">\n        <button type=\"button\" data-basis=\"in\" aria-pressed=\"true\">\n            <span class=\"sw-name\">Count what went in</span><span class=\"sw-sub\">donations + owed to lenders</span>\n        </button>\n        <button type=\"button\" data-basis=\"held\" aria-pressed=\"false\">\n            <span class=\"sw-name\">Count what is held</span><span class=\"sw-sub\">on loan + cash − undistributed</span>\n        </button>\n    </div>\n\n    <div class=\"demo-figure\">\n        <span class=\"demo-figure-label\">Total fund size</span>\n        <span class=\"demo-figure-value\" data-out=\"total\">$1,633,917.56</span>\n        <div class=\"demo-bars\" data-out=\"bars\"></div>\n        <div class=\"demo-gap\" data-out=\"gap\"></div>\n    </div></div>\n    <p class=\"demo-caption\">Counting from money-in produces a figure that can only ever rise. Four years of bank fees, write-offs and running costs had never come off it — and could not be netted off, because the books hold zero recorded transactions. Counting what is <em>held</em> needs no expense record to be correct: money that left the bank is already absent from it.</p>\n</figure>\n\n            <section class=\"case-glance\">\n                <div class=\"glance-col\">\n                    <h2>The problem</h2>\n                    <ul class=\"glance-list\"><li>A fund capitalised two ways — donated money, and money owed back to 44 lenders.</li><li>Loan contracts sat as PDFs in Drive, disconnected from any record of the loan.</li><li>The headline fund figure had drifted $47,383 from what the bank actually held.</li></ul>\n                </div>\n                <div class=\"glance-col\">\n                    <h2>What we built</h2>\n                    <ul class=\"glance-list glance-check\"><li>A loan ledger with borrowers, guarantors, repayment schedules and per-lender balances.</li><li>Contract sync from Google Drive, with guarantor extraction backfilled from the documents themselves.</li><li>A dashboard that reports the fund from the side that can actually be verified.</li><li>Per-lender statements showing each lender&#39;s money at work as a share of what the fund holds.</li></ul>\n                </div>\n            </section>\n\n            <section class=\"case-outcome\">\n                <h2>Outcome</h2>\n                <ul class=\"case-list case-list-check\"><li>The headline figure reconciles to the bank balance with no unexplained remainder.</li><li>Lender statements now show a share of what the fund actually holds.</li><li>The growth chart was relabelled rather than redrawn — it charts money in, which is a real series, instead of being forced onto a basis the underlying data cannot support.</li></ul>\n                <div class=\"case-stack\">\n                    <span>PHP</span><span>MySQL</span><span>Google Drive API</span><span>Docker</span><span>Coolify</span>\n                </div>\n            </section>\n\n            <details class=\"case-longform\">\n                <summary>\n                    <span class=\"lf-title\">The full write-up</span>\n                    <span class=\"lf-sub\">problem, constraints, and the whole debugging story — about a 4-minute read</span>\n                </summary>\n                <div class=\"lf-body\">\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">01</span> The problem</h3>\n                        <p>The fund lends interest-free and is capitalised by two very different sources: money donated outright, and money lent to the fund by 44 individuals who expect it back. Tracking who is owed what, what is out on loan, and what is actually in the bank was a spreadsheet exercise nobody could fully verify.</p>\n                        <p>Loan contracts lived as PDFs in Google Drive, disconnected from any record of the loan itself, and guarantor details existed only inside those documents.</p>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">02</span> Constraints</h3>\n                        <ul class=\"case-list\"><li>The books had zero journal entries and zero recorded transactions — four years of bank fees, write-offs and running costs had simply never been entered anywhere.</li><li>The bookkeeping tool in use has no scheduled export and no per-transaction API, so expenses could not be pulled in and netted off.</li><li>The administrators are not technical. Anything requiring a reconciliation ritual would not get done.</li></ul>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">03</span> What we built</h3>\n                        <ul class=\"case-list case-list-check\"><li>A loan ledger with borrowers, guarantors, repayment schedules and per-lender balances.</li><li>Contract sync from Google Drive, with guarantor extraction backfilled from the documents themselves.</li><li>A dashboard that reports the fund from the side that can actually be verified.</li><li>Per-lender statements showing each lender&#39;s money at work as a share of what the fund holds.</li></ul>\n                    </section>\n                    <section class=\"case-section case-hard\">\n                        <div class=\"case-hard-tag\">The hard part, in full</div>\n                        <h3>The headline number was measuring the wrong side</h3>\n                        <p>Total Fund Size was computed from money that went <strong>in</strong>: donations plus what was still owed to lenders. That figure can only ever rise. Four years of bank fees, write-offs and running costs had left the fund without ever coming off the total.</p>\n                        <p>So the dashboard read <strong>$1,633,917.56</strong> while the gemach actually held <strong>$1,586,533.86</strong>, and the $47,383.70 between them sat on the page labelled &quot;unexplained difference&quot; — visible to everyone, explicable by no one.</p>\n                        <p>The instinct is to find the missing expenses and subtract them. That was impossible: there is no expense record to find, and building one retroactively across four years would have been an invention, not a reconstruction.</p>\n                        <p>The fix was to change which side the number is counted from. Fund size is now <strong>what is held</strong> — out on loan, plus cash in the bank, minus grants still to be distributed. That needs no expense record to be correct, because money that has left the bank is already absent from it. Money-in is kept as its own separate figure, since &quot;who do we owe&quot; is a genuinely different question from &quot;what do we have&quot;, and the gap between them is now reported plainly as what has been spent.</p>\n                        <p>Two consequences were accepted deliberately. A lender&#39;s share of the fund rose, because the denominator got smaller — and that is the more truthful number. And the fund is allowed to go negative rather than being clamped at zero: a fund over-committed to causes should say so on its own dashboard.</p>\n                        <aside class=\"case-lesson\">\n                            <span class=\"case-lesson-label\">What it taught us</span>\n                            <p>Not every wrong number is a bug. This one was an accounting definition that had quietly stopped matching reality, and the correct fix changed what the system claims to measure — which is a decision to take with the client, not a patch to ship quietly.</p>\n                        </aside>\n                    </section>\n                </div>\n            </details>\n        </div>\n\n        \n        <nav class=\"case-nav\">\n            <div class=\"container case-narrow case-nav-inner\">\n                <a class=\"case-nav-item prev\" href=\"/work/multi-campus-engagement-platform\">\n                    <span class=\"case-nav-dir\">Previous</span>\n                    <span class=\"case-nav-name\">Multi-campus engagement platform</span>\n                </a>\n                <a class=\"case-nav-item next\" href=\"/work/msp-time-compliance-portal\">\n                    <span class=\"case-nav-dir\">Next</span>\n                    <span class=\"case-nav-name\">MSP time-compliance portal</span>\n                </a>\n            </div>\n        </nav>\n    </article>\n    \n    <section class=\"section cta-band\">\n        <div class=\"container\">\n            <div class=\"cta-band-inner\">\n                <h2>Got something shaped like this?</h2>\n                <p>Tell us what it is and what has stopped working. We will tell you what we would build.</p>\n                <div class=\"cta-band-actions\">\n                    <a href=\"/#contact\" class=\"btn btn-primary\" data-track=\"cta-band-contact\">Start a conversation</a>\n                    <a href=\"/work\" class=\"btn btn-secondary\" data-track=\"cta-band-work\">See more work</a>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <footer class=\"footer\">\n        <div class=\"container footer-inner\">\n            <div class=\"footer-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </div>\n            <div class=\"footer-links\">\n                <a href=\"/work\">Work</a>\n                <a href=\"/#practice\">What we do</a>\n                <a href=\"/#contact\">Contact</a>\n            </div>\n            <div class=\"footer-copy\">&copy; 2026 Kaymen Group LLC</div>\n        </div>\n    </footer>\n    <!--SCRIPT-->\n</body>\n</html>"},{"id":"msp-time-compliance-portal","label":"MSP time-compliance portal","group":"Integrations","path":"/work/msp-time-compliance-portal","html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>MSP time-compliance portal — kaymen.dev</title>\n    <meta name=\"description\" content=\"Billable hours were leaking. The API could not answer the question being asked.\">\n    <link rel=\"canonical\" href=\"https://kaymen.dev/work/msp-time-compliance-portal\">\n    <meta property=\"og:type\" content=\"article\">\n    <meta property=\"og:url\" content=\"https://kaymen.dev/work/msp-time-compliance-portal\">\n    <met iv class=\"nav-links\" id=\"navLinks\">\n                <a href=\"/#work\" data-track=\"nav-work\">Work</a>\n                <a href=\"/#practice\" data-track=\"nav-practice\">What we do</a>\n                <a href=\"/#process\" data-track=\"nav-process\">Process</a>\n                <a href=\"/#contact\" class=\"nav-cta\" data-track=\"nav-contact\">Let's Talk</a>\n            </div>\n            <button class=\"theme-toggle\" id=\"themeToggle\" aria-label=\"Toggle theme\">\n                <svg class=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><circle cx=\"12\" cy=\"12\" r=\"5\"/><path d=\"M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\"/></svg>\n                <svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><path d=\"M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z\"/></svg>\n            </button>\n            <button class=\"nav-hamburger\" id=\"hamburger\" aria-label=\"Toggle menu\">\n                <span></span><span></span><span></span>\n            </button>\n        </div>\n    </nav>\n\n    <article class=\"case\">\n        <header class=\"case-hero\">\n            <div class=\"container case-narrow\">\n                <a class=\"case-back\" href=\"/work\" data-track=\"case-back\">\n                    <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z\"/></svg>\n                    All work\n                </a>\n                <div class=\"case-meta\">\n                    <span class=\"case-area\">Business systems &amp; integrations</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-status\">Live in production</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-year\">2026</span>\n                </div>\n                <h1>MSP time-compliance portal</h1>\n                <p class=\"case-tagline\">Billable hours were leaking. The API could not answer the question being asked.</p>\n                <p class=\"case-summary\">A managed service provider could not tell whether its engineers were logging time. We built a near-real-time compliance portal on top of a PSA API that times out on any query broad enough to be useful.</p>\n                \n                <div class=\"case-scale\">\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">20,920</span>\n                        <span class=\"case-scale-label\">tickets under delta sync</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">5,216</span>\n                        <span class=\"case-scale-label\">time entries reconciled</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">10 min</span>\n                        <span class=\"case-scale-label\">refresh interval</span>\n                    </div>\n                </div>\n            </div>\n        </header>\n\n        <div class=\"container case-narrow case-body\">\n            <figure class=\"demo\" data-demo=\"ingest\">\n    <figcaption class=\"demo-head\">\n        <span class=\"demo-tag\">Interactive — try it</span>\n        <h3 class=\"demo-title\">Ask for more history. Get nothing at all.</h3>\n        <p class=\"demo-kicker\">Roughly 243,000 tickets exist. The failure is not slowness — it is a total loss.</p>\n    </figcaption>\n    <div class=\"demo-body\">\n    <div class=\"demo-switch wide\" role=\"group\" aria-label=\"Ingestion strategy\">\n        <button type=\"button\" data-mode=\"naive\" aria-pressed=\"true\">\n            <span class=\"sw-name\">Fetch it all</span><span class=\"sw-sub\">one unbounded query</span>\n        </button>\n        <button type=\"button\" data-mode=\"bounded\" aria-pressed=\"false\">\n            <span class=\"sw-name\">Bounded backfill + delta sync</span><span class=\"sw-sub\">resumable, per-entity state</span>\n        </button>\n    </div>\n\n    <div class=\"demo-scrub\">\n        <label for=\"demo-ingest-years\">History requested</label>\n        <input type=\"range\" id=\"demo-ingest-years\" min=\"1\" max=\"60\" value=\"8\" step=\"1\">\n        <output data-out=\"window\">8 months</output>\n    </div>\n\n    <div class=\"demo-facts wide\">\n        <span><em>matching tickets</em> <code data-out=\"rows\">20,920</code></span>\n        <span><em>result</em> <code data-out=\"verdictShort\">ok</code></span>\n    </div>\n\n    <div class=\"demo-progress\"><span data-out=\"bar\"></span></div>\n    <div class=\"demo-verdict\" data-out=\"verdict\"></div></div>\n    <p class=\"demo-caption\">An unbounded query times out server-side and returns <em>nothing</em> — no partial result, no cursor, no clue about the shape of the problem. The fix is not a cleverer query. It is accepting that you now own a synchronisation problem, and building the per-entity state that makes it resumable.</p>\n</figure>\n\n            <section class=\"case-glance\">\n                <div class=\"glance-col\">\n                    <h2>The problem</h2>\n                    <ul class=\"glance-list\"><li>Engineers were not consistently logging time, and billable hours were leaking.</li><li>The PSA holds the data but cannot express the question: who has not logged, for how long.</li><li>Roughly 243,000 lifetime tickets — any query broad enough to be useful times out.</li></ul>\n                </div>\n                <div class=\"glance-col\">\n                    <h2>What we built</h2>\n                    <ul class=\"glance-list glance-check\"><li>A Python ingestion service doing bounded historical backfill plus continuous delta sync on last-activity, with per-entity sync state so an interrupted run resumes rather than restarts.</li><li>A FastAPI portal with a colour-coded compliance dashboard — hours logged against target, days with zero entries, tickets worked with no time recorded, last-entry timestamp per engineer.</li><li>Per-engineer drill-down: daily time chart, customers worked, time by billing code, ticket classifications, full ticket list.</li><li>Roster classification as a self-serve screen, with every metric downstream obeying it.</li></ul>\n                </div>\n            </section>\n\n            <section class=\"case-outcome\">\n                <h2>Outcome</h2>\n                <ul class=\"case-list case-list-check\"><li>Full history backfilled in around 70 seconds; 20,920 tickets and 5,216 time entries in continuous sync.</li><li>Compliance visible per engineer per day, with red/amber/green thresholds instead of a spreadsheet.</li><li>Roster changes handled by the team, not by a code change.</li><li>A failed sync raises a banner across the app rather than quietly serving stale numbers.</li></ul>\n                <div class=\"case-stack\">\n                    <span>Python 3.12</span><span>FastAPI</span><span>APScheduler</span><span>SQLite</span><span>PSA REST API</span><span>Docker</span>\n                </div>\n            </section>\n\n            <details class=\"case-longform\">\n                <summary>\n                    <span class=\"lf-title\">The full write-up</span>\n                    <span class=\"lf-sub\">problem, constraints, and the whole debugging story — about a 4-minute read</span>\n                </summary>\n                <div class=\"lf-body\">\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">01</span> The problem</h3>\n                        <p>Engineers were not consistently recording time entries, and leadership had no visibility into daily work. Billable hours were being lost somewhere between the work happening and the work being recorded, and nobody could point at where.</p>\n                        <p>The PSA holds the data, but its reporting cannot express the question that matters: which engineer has not logged time, for how long, against which tickets.</p>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">02</span> Constraints</h3>\n                        <ul class=\"case-list\"><li>The account holds roughly 243,000 tickets across its lifetime. Any unbounded query against that history times out server-side — there is no &quot;just fetch it all&quot; path.</li><li>Refresh had to feel live — minutes, not a nightly batch — because the whole point is catching a gap while it is still today&#39;s problem.</li><li>Compliance thresholds are per-person and depend on whether someone is an engineer, management, or excluded entirely. The API has no such concept.</li></ul>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">03</span> What we built</h3>\n                        <ul class=\"case-list case-list-check\"><li>A Python ingestion service doing bounded historical backfill plus continuous delta sync on last-activity, with per-entity sync state so an interrupted run resumes rather than restarts.</li><li>A FastAPI portal with a colour-coded compliance dashboard — hours logged against target, days with zero entries, tickets worked with no time recorded, last-entry timestamp per engineer.</li><li>Per-engineer drill-down: daily time chart, customers worked, time by billing code, ticket classifications, full ticket list.</li><li>Roster classification as a self-serve screen, with every metric downstream obeying it.</li><li>A settings screen holding API credentials and sync interval, so a rotated secret is a form submission rather than a redeploy.</li></ul>\n                    </section>\n                    <section class=\"case-section case-hard\">\n                        <div class=\"case-hard-tag\">The hard part, in full</div>\n                        <h3>Designing around an API that cannot answer the question</h3>\n                        <p>The naive shape — pull everything, compute locally — dies immediately. An all-time ticket query against 243,000 records times out server-side and returns nothing at all, so there is no partial result to work with and no error that tells you the shape of the problem.</p>\n                        <p>The ingestion was rebuilt as two distinct mechanisms with different jobs. A bounded backfill fetches history from a fixed start date, which makes the initial load a known, finite, resumable amount of work. On top of that, a delta sync polls on last-activity and keeps the window fresh. Sync state is tracked per entity, so extending the history horizon later means clearing one row rather than re-running the whole import.</p>\n                        <p>The second problem was subtler and mattered more. The metric leadership actually wanted — *is this person compliant* — depends on a roster classification the PSA does not model. The obvious approach is a hard-coded list of engineer IDs. That list is wrong the first time somebody joins, and being silently wrong is exactly the failure this portal exists to prevent.</p>\n                        <p>So classification became a first-class, editable concept in the product, and every metric derives from it. Roster curation is self-serve; it stopped being an engineering dependency and stopped being a source of quiet drift.</p>\n                        <aside class=\"case-lesson\">\n                            <span class=\"case-lesson-label\">What it taught us</span>\n                            <p>When an API cannot answer your question, the fix is usually not a cleverer query — it is accepting that you now own a synchronisation problem, and building the state tracking that makes it resumable.</p>\n                        </aside>\n                    </section>\n                </div>\n            </details>\n        </div>\n\n        \n        <nav class=\"case-nav\">\n            <div class=\"container case-narrow case-nav-inner\">\n                <a class=\"case-nav-item prev\" href=\"/work/community-lending-ledger\">\n                    <span class=\"case-nav-dir\">Previous</span>\n                    <span class=\"case-nav-name\">Community lending ledger</span>\n                </a>\n                <a class=\"case-nav-item next\" href=\"/work/bilingual-booking-platform\">\n                    <span class=\"case-nav-dir\">Next</span>\n                    <span class=\"case-nav-name\">Bilingual therapeutic-riding booking platform</span>\n                </a>\n            </div>\n        </nav>\n    </article>\n    \n    <section class=\"section cta-band\">\n        <div class=\"container\">\n            <div class=\"cta-band-inner\">\n                <h2>Got something shaped like this?</h2>\n                <p>Tell us what it is and what has stopped working. We will tell you what we would build.</p>\n                <div class=\"cta-band-actions\">\n                    <a href=\"/#contact\" class=\"btn btn-primary\" data-track=\"cta-band-contact\">Start a conversation</a>\n                    <a href=\"/work\" class=\"btn btn-secondary\" data-track=\"cta-band-work\">See more work</a>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <footer class=\"footer\">\n        <div class=\"container footer-inner\">\n            <div class=\"footer-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </div>\n            <div class=\"footer-links\">\n                <a href=\"/work\">Work</a>\n                <a href=\"/#practice\">What we do</a>\n                <a href=\"/#contact\">Contact</a>\n            </div>\n            <div class=\"footer-copy\">&copy; 2026 Kaymen Group LLC</div>\n        </div>\n    </footer>\n    <!--SCRIPT-->\n</body>\n</html>"},{"id":"bilingual-booking-platform","label":"Bilingual therapeutic-riding booking platform","group":"Apps","path":"/work/bilingual-booking-platform","html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Bilingual therapeutic-riding booking platform — kaymen.dev</title>\n    <meta name=\"description\" content=\"The booking calendar rendered perfectly, and it was empty.\">\n    <link rel=\"canonical\" href=\"https://kaymen.dev/work/bilingual-booking-platform\">\n    <meta property=\"og:type\" content=\"article\">\n    <meta property=\"og:url\" content=\"https://kaymen.dev/work/bilingual-booking-platform\">\n    <meta property=\"og:site_name\" content=\"kaymen.dev\">\n    <meta property=\"og:title\" content=\"Bilingual therapeutic-riding booking platform — kaymen.dev\">\n    <meta property=\"og:description\" content=\"The booking calendar rendered perfectly, and it was empty.\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n    <meta name=\"twitter:title\" content=\"Bilingual therapeutic-riding booking platform — kaymen.dev\">\n    <meta name=\"twitter:description\" content=\"The booking calendar rendered perfectly, and it was empty.\">\n    <meta name=\"theme-color\" content=\"#09090b\">\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n    <!--STYLE-->\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+DQogIDxkZWZzPg0KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMTAwJSI+DQogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjM2I4MmY2Ii8+DQogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM4YjVjZjYiLz4NCiAgICA8L2xpbmVhckdyYWRpZW50Pg0KICA8L2RlZnM+DQogIDxyZWN0IHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgcng9IjgiIGZpbGw9IiMwOTA5MGIiLz4NCiAgPHRleHQgeD0iNCIgeT0iMjMiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtd2VpZ2h0PSI3MDAiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9InVybCgjZykiPks8L3RleHQ+DQogIDxjaXJjbGUgY3g9IjI0IiBjeT0iMTAiIHI9IjMiIGZpbGw9InVybCgjZykiIG9wYWNpdHk9IjAuNiIvPg0KPC9zdmc+DQo=\">\n</head>\n<body>\n\n    <nav class=\"nav\" id=\"nav\">\n        <div class=\"nav-inner\">\n            <a href=\"/\" class=\"nav-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </a>\n            <div class=\"nav-links\" id=\"navLinks\">\n                <a href=\"/#work\" data-track=\"nav-work\">Work</a>\n                <a href=\"/#practice\" data-track=\"nav-practice\">What we do</a>\n                <a href=\"/#process\" data-track=\"nav-process\">Process</a>\n                <a href=\"/#contact\" class=\"nav-cta\" data-track=\"nav-contact\">Let's Talk</a>\n            </div>\n            <button class=\"theme-toggle\" id=\"themeToggle\" aria-label=\"Toggle theme\">\n                <svg class=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><circle cx=\"12\" cy=\"12\" r=\"5\"/><path d=\"M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\"/></svg>\n                <svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><path d=\"M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z\"/></svg>\n            </button>\n            <button class=\"nav-hamburger\" id=\"hamburger\" aria-label=\"Toggle menu\">\n                <span></span><span></span><span></span>\n            </button>\n        </div>\n    </nav>\n\n    <article class=\"case\">\n        <header class=\"case-hero\">\n            <div class=\"container case-narrow\">\n                <a class=\"case-back\" href=\"/work\" data-track=\"case-back\">\n                    <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z\"/></svg>\n                    All work\n                </a>\n                <div class=\"case-meta\">\n                    <span class=\"case-area\">Consumer &amp; mobile apps</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-status\">Live in production</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-year\">2026</span>\n                </div>\n                <h1>Bilingual therapeutic-riding booking platform</h1>\n                <p class=\"case-tagline\">The booking calendar rendered perfectly, and it was empty.</p>\n                <p class=\"case-summary\">A therapeutic horse-riding practice took bookings by phone and WhatsApp. We built a bilingual Hebrew/English booking site with a self-service admin — and hit a failure mode that produces no error at all.</p>\n                \n                <div class=\"case-scale\">\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">HE / EN</span>\n                        <span class=\"case-scale-label\">full RTL and LTR</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">30 days</span>\n                        <span class=\"case-scale-label\">rolling bookable horizon</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">0</span>\n                        <span class=\"case-scale-label\">errors when it broke</span>\n                    </div>\n                </div>\n            </div>\n        </header>\n\n        <div class=\"container case-narrow case-body\">\n            <figure class=\"demo\" data-demo=\"horizon\">\n    <figcaption class=\"demo-head\">\n        <span class=\"demo-tag\">Interactive — try it</span>\n        <h3 class=\"demo-title\">Drag time forward. Watch nothing break.</h3>\n        <p class=\"demo-kicker\">Bookable slots are generated into a rolling window. Generation ran once, at deploy.</p>\n    </figcaption>\n    <div class=\"demo-body\">\n    <div class=\"demo-scrub\">\n        <label for=\"demo-horizon-day\">Days since deploy</label>\n        <input type=\"range\" id=\"demo-horizon-day\" min=\"0\" max=\"45\" value=\"0\" step=\"1\">\n        <output data-out=\"day\">0</output>\n    </div>\n\n    <div class=\"demo-monitor\">\n        <span class=\"demo-pill ok\" data-out=\"status\">200 OK</span>\n        <span class=\"demo-pill quiet\" data-out=\"alerts\">0 alerts</span>\n        <span class=\"demo-pill quiet\" data-out=\"errors\">0 errors</span>\n    </div>\n\n    <div class=\"demo-calendar\" data-out=\"calendar\" aria-hidden=\"true\"></div>\n    <div class=\"demo-slotline\"><span data-out=\"slots\">28 bookable slots</span></div>\n\n    <div class=\"demo-checks\">\n        <label class=\"demo-check\">\n            <input type=\"checkbox\" data-fix=\"alert\">\n            <span><em>Detect it</em> — treat an empty forward window as a health-check failure</span>\n        </label>\n        <label class=\"demo-check\">\n            <input type=\"checkbox\" data-fix=\"job\">\n            <span><em>Fix it</em> — run the horizon job daily instead of once at deploy</span>\n        </label>\n    </div>\n\n    <div class=\"demo-verdict\" data-out=\"verdict\"></div></div>\n    <p class=\"demo-caption\">The site was up, the API returned 200, and the calendar rendered correctly — with nothing in it. A correctly-rendered empty calendar is indistinguishable from a quiet week to every monitor you would think to set up. Uptime checks answer <em>did it respond</em>, never <em>did it respond with anything</em>.</p>\n</figure>\n\n            <section class=\"case-glance\">\n                <div class=\"glance-col\">\n                    <h2>The problem</h2>\n                    <ul class=\"glance-list\"><li>Every booking ran through a phone call or a WhatsApp message.</li><li>Hebrew-first with English, fully right-to-left — not a translation layer.</li><li>A non-technical owner: anything needing a mental model of the data would go unused.</li></ul>\n                </div>\n                <div class=\"glance-col\">\n                    <h2>What we built</h2>\n                    <ul class=\"glance-list glance-check\"><li>A bilingual Astro front end with React islands, full RTL, and an Express + MySQL booking API.</li><li>Slot generation from recurring templates, one series per active session type, each using its own duration.</li><li>A pending-first booking flow: submission holds the slot, an admin confirms or declines.</li><li>An admin panel deliberately kept to the smallest surface that does the job.</li></ul>\n                </div>\n            </section>\n\n            <section class=\"case-outcome\">\n                <h2>Outcome</h2>\n                <ul class=\"case-list case-list-check\"><li>Bookings run through the site, with the owner confirming rather than coordinating.</li><li>Hebrew and English users get the same product, in the correct direction, not a translated fallback.</li><li>The horizon is maintained by a daily job, and an empty forward window now pages instead of passing.</li></ul>\n                <div class=\"case-stack\">\n                    <span>Astro 5</span><span>React</span><span>Express</span><span>MySQL 8</span><span>Cloudflare R2</span><span>Docker</span>\n                </div>\n            </section>\n\n            <details class=\"case-longform\">\n                <summary>\n                    <span class=\"lf-title\">The full write-up</span>\n                    <span class=\"lf-sub\">problem, constraints, and the whole debugging story — about a 4-minute read</span>\n                </summary>\n                <div class=\"lf-body\">\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">01</span> The problem</h3>\n                        <p>Every booking went through a phone call or a WhatsApp message, which meant double-bookings, no record, and an owner doing scheduling admin instead of running sessions.</p>\n                        <p>The practice operates in Hebrew, with English-speaking clients too — so the site is genuinely bilingual and right-to-left, not an English site with a translation bolted on.</p>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">02</span> Constraints</h3>\n                        <ul class=\"case-list\"><li>The owner is not technical. An admin panel requiring a mental model of the data would go unused, and the system would quietly revert to WhatsApp.</li><li>Bookings must never auto-confirm — a slot is held on submission, but a human decides.</li><li>Session types have different durations, and the schedule is defined by recurring templates rather than by hand-entered slots.</li></ul>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">03</span> What we built</h3>\n                        <ul class=\"case-list case-list-check\"><li>A bilingual Astro front end with React islands, full RTL, and an Express + MySQL booking API.</li><li>Slot generation from recurring templates, one series per active session type, each using its own duration.</li><li>A pending-first booking flow: submission holds the slot, an admin confirms or declines.</li><li>An admin panel deliberately kept to the smallest surface that does the job.</li></ul>\n                    </section>\n                    <section class=\"case-section case-hard\">\n                        <div class=\"case-hard-tag\">The hard part, in full</div>\n                        <h3>A failure mode with no error state</h3>\n                        <p>Bookable slots are generated ahead of time from recurring templates into a rolling window. Generation ran at deploy, which is fine on day one and wrong forever after: the window advanced, generation did not, and the horizon quietly ran dry.</p>\n                        <p>The result is the worst kind of outage. The site was up. The API returned 200. The calendar rendered correctly. It simply had nothing in it — and a correctly-rendered empty calendar is indistinguishable, to every monitor you would think to set up, from a correctly-rendered calendar on a quiet week.</p>\n                        <p>No exception was thrown, no request failed, and no alert existed that could have fired, because nothing was in an error state. The only signal was the absence of bookings, which looks exactly like ordinary quiet.</p>\n                        <p>The fix is two parts, and the second matters more than the first. A daily job now keeps the horizon extended. And the health check was inverted to treat an empty forward window as a failure rather than a valid response — the system now has to prove it has availability, instead of being trusted because it did not crash.</p>\n                        <aside class=\"case-lesson\">\n                            <span class=\"case-lesson-label\">What it taught us</span>\n                            <p>Uptime monitoring answers &quot;did it respond.&quot; It does not answer &quot;did it respond with anything.&quot; For anything generated on a horizon — slots, schedules, forecasts, rotations — the emptiness itself has to be the alert.</p>\n                        </aside>\n                    </section>\n                </div>\n            </details>\n        </div>\n\n        \n        <nav class=\"case-nav\">\n            <div class=\"container case-narrow case-nav-inner\">\n                <a class=\"case-nav-item prev\" href=\"/work/msp-time-compliance-portal\">\n                    <span class=\"case-nav-dir\">Previous</span>\n                    <span class=\"case-nav-name\">MSP time-compliance portal</span>\n                </a>\n                <a class=\"case-nav-item next\" href=\"/work/torah-tracker\">\n                    <span class=\"case-nav-dir\">Next</span>\n                    <span class=\"case-nav-name\">Torah Tracker</span>\n                </a>\n            </div>\n        </nav>\n    </article>\n    \n    <section class=\"section cta-band\">\n        <div class=\"container\">\n            <div class=\"cta-band-inner\">\n                <h2>Got something shaped like this?</h2>\n                <p>Tell us what it is and what has stopped working. We will tell you what we would build.</p>\n                <div class=\"cta-band-actions\">\n                    <a href=\"/#contact\" class=\"btn btn-primary\" data-track=\"cta-band-contact\">Start a conversation</a>\n                    <a href=\"/work\" class=\"btn btn-secondary\" data-track=\"cta-band-work\">See more work</a>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <footer class=\"footer\">\n        <div class=\"container footer-inner\">\n            <div class=\"footer-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </div>\n            <div class=\"footer-links\">\n                <a href=\"/work\">Work</a>\n                <a href=\"/#practice\">What we do</a>\n                <a href=\"/#contact\">Contact</a>\n            </div>\n            <div class=\"footer-copy\">&copy; 2026 Kaymen Group LLC</div>\n        </div>\n    </footer>\n    <!--SCRIPT-->\n</body>\n</html>"},{"id":"torah-tracker","label":"Torah Tracker","group":"Apps","path":"/work/torah-tracker","html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Torah Tracker — kaymen.dev</title>\n    <meta name=\"description\" content=\"A rewrite shipped to an installed base, without reaching zero users.\">\n    <link rel=\"canonical\" href=\"https://kaymen.dev/work/torah-tracker\">\n    <meta property=\"og:type\" content=\"article\">\n    <meta property=\"og:url\" content=\"https://kaymen.dev/work/torah-tracker\">\n    <meta property=\"og:site_name\" content=\"kaymen.dev\">\n    <meta property=\"og:title\" content=\"Torah Tracker — kaymen.dev\">\n    <meta property=\"og:description\" content=\"A rewrite shipped to an installed base, without reaching zero users.\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n    <meta name=\"twitter:title\" content=\"Torah Tracker — kaymen.dev\">\n    <meta name=\"twitter:description\" content=\"A rewrite shipped to an installed base, without reaching zero users.\">\n    <meta name=\"theme-color\" content=\"#09090b\">\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n    <!--STYLE-->\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXd
