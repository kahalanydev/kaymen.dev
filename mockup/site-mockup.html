d=\"hamburger\" aria-label=\"Toggle menu\">\n                <span></span><span></span><span></span>\n            </button>\n        </div>\n    </nav>\n\n    <article class=\"case\">\n        <header class=\"case-hero\">\n            <div class=\"container case-narrow\">\n                <a class=\"case-back\" href=\"/work\" data-track=\"case-back\">\n                    <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z\"/></svg>\n                    All work\n                </a>\n                <div class=\"case-meta\">\n                    <span class=\"case-area\">Consumer &amp; mobile apps</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-status\">Live — App Store &amp; Google Play</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-year\">2026</span>\n                </div>\n                <h1>Torah Tracker</h1>\n                <p class=\"case-tagline\">A rewrite shipped to an installed base, without reaching zero users.</p>\n                <p class=\"case-summary\">A learning-tracker app that started as a PWA and was rewritten in React Native for the App Store and Google Play. The interesting part was not the rewrite — it was delivering updates to people who already had the old build installed.</p>\n                <a class=\"btn btn-secondary case-live\" href=\"https://torahtracker.app\" target=\"_blank\" rel=\"noopener\" data-track=\"case-live-torah-tracker\">View it live\n                        <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"13\" height=\"13\"><path fill-rule=\"evenodd\" d=\"M5.22 14.78a.75.75 0 001.06 0l7.22-7.22v5.69a.75.75 0 001.5 0v-7.5a.75.75 0 00-.75-.75h-7.5a.75.75 0 000 1.5h5.69l-7.22 7.22a.75.75 0 000 1.06z\"/></svg>\n                    </a>\n                <div class=\"case-scale\">\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">iOS + Android</span>\n                        <span class=\"case-scale-label\">native, in both stores</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">OTA</span>\n                        <span class=\"case-scale-label\">updates without a store round-trip</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">0</span>\n                        <span class=\"case-scale-label\">users a mismatched update reaches</span>\n                    </div>\n                </div>\n            </div>\n        </header>\n\n        <div class=\"container case-narrow case-body\">\n            <figure class=\"demo\" data-demo=\"ota\">\n    <figcaption class=\"demo-head\">\n        <span class=\"demo-tag\">Interactive — try it</span>\n        <h3 class=\"demo-title\">Publish an update. Reach zero users.</h3>\n        <p class=\"demo-kicker\">Expo matches updates to a runtime version. A device only accepts its own.</p>\n    </figcaption>\n    <div class=\"demo-body\">\n    <div class=\"demo-dials\">\n        <div class=\"demo-dial\">\n            <span class=\"demo-dial-label\">app.json <em>runtimeVersion</em></span>\n            <div class=\"demo-stepper\">\n                <button type=\"button\" data-step=\"config:-1\" aria-label=\"Decrease\">−</button>\n                <code data-out=\"config\">2.1.0</code>\n                <button type=\"button\" data-step=\"config:1\" aria-label=\"Increase\">+</button>\n            </div>\n        </div>\n        <div class=\"demo-dial\">\n            <span class=\"demo-dial-label\">binary in the store</span>\n            <div class=\"demo-stepper\">\n                <button type=\"button\" data-step=\"store:-1\" aria-label=\"Decrease\">−</button>\n                <code data-out=\"store\">2.0.1</code>\n                <button type=\"button\" data-step=\"store:1\" aria-label=\"Increase\">+</button>\n            </div>\n        </div>\n    </div>\n\n    <button type=\"button\" class=\"demo-action\" data-publish>eas update --branch production</button>\n\n    <div class=\"demo-terminal\" data-out=\"terminal\"></div>\n\n    <div class=\"demo-reach\">\n        <span class=\"demo-reach-label\">Installed devices that receive it</span>\n        <div class=\"demo-reach-bar\"><span data-out=\"reachbar\"></span></div>\n        <span class=\"demo-reach-value\" data-out=\"reach\">0%</span>\n    </div></div>\n    <p class=\"demo-caption\">The publish succeeds either way. It reports success, exits zero, and appears in the dashboard — it has simply landed on a runtime no installed device has. “Did it publish” and “did it arrive” are different questions, and only one of them is answered for you.</p>\n</figure>\n\n            <section class=\"case-glance\">\n                <div class=\"glance-col\">\n                    <h2>The problem</h2>\n                    <ul class=\"glance-list\"><li>A progressive web app that could not do reliable notifications or real offline.</li><li>Real users already on the old build — a rewrite that stranded them is a downgrade.</li><li>Store review on every fix is not a viable loop for a small team.</li></ul>\n                </div>\n                <div class=\"glance-col\">\n                    <h2>What we built</h2>\n                    <ul class=\"glance-list glance-check\"><li>A React Native / Expo rewrite that replaced the PWA as the production app on iOS, Android and web.</li><li>An OTA update pipeline gated on runtime version, so an update can only publish to a runtime that shipped builds actually have.</li><li>A TypeScript check as a release gate, ahead of any publish.</li><li>Notification handling that accounts for vendor-specific battery restrictions rather than assuming a stock Android.</li></ul>\n                </div>\n            </section>\n\n            <section class=\"case-outcome\">\n                <h2>Outcome</h2>\n                <ul class=\"case-list case-list-check\"><li>Live in the App Store and on Google Play, with the PWA retired.</li><li>Fixes reach existing users over the air, without a store review cycle.</li><li>Update delivery is verified against the installed base rather than assumed from a successful publish.</li></ul>\n                <div class=\"case-stack\">\n                    <span>React Native</span><span>Expo / EAS</span><span>TypeScript</span><span>Node.js</span><span>Docker</span><span>Coolify</span>\n                </div>\n            </section>\n\n            <details class=\"case-longform\">\n                <summary>\n                    <span class=\"lf-title\">The full write-up</span>\n                    <span class=\"lf-sub\">problem, constraints, and the whole debugging story — about a 4-minute read</span>\n                </summary>\n                <div class=\"lf-body\">\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">01</span> The problem</h3>\n                        <p>The original product was a progressive web app. It worked, but it could not do the things that make a daily-habit app stick on a phone — reliable notifications, a home-screen presence people trust, and offline behaviour that survives a commute.</p>\n                        <p>Rewriting it native meant taking on the entire release-engineering problem that a web app simply does not have.</p>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">02</span> Constraints</h3>\n                        <ul class=\"case-list\"><li>Real users on the existing build. A rewrite that stranded them would have been a downgrade dressed as a launch.</li><li>Over-the-air updates were essential — waiting on store review for every fix is not a viable loop for a small team.</li><li>Android notification delivery is not uniform. Some vendors defer background work aggressively enough to make a reminder app useless by default.</li></ul>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">03</span> What we built</h3>\n                        <ul class=\"case-list case-list-check\"><li>A React Native / Expo rewrite that replaced the PWA as the production app on iOS, Android and web.</li><li>An OTA update pipeline gated on runtime version, so an update can only publish to a runtime that shipped builds actually have.</li><li>A TypeScript check as a release gate, ahead of any publish.</li><li>Notification handling that accounts for vendor-specific battery restrictions rather than assuming a stock Android.</li></ul>\n                    </section>\n                    <section class=\"case-section case-hard\">\n                        <div class=\"case-hard-tag\">The hard part, in full</div>\n                        <h3>The update that publishes successfully to nobody</h3>\n                        <p>Expo over-the-air updates are matched to a <strong>runtime version</strong>. A device only accepts an update published to the runtime its installed binary was built with. That is the correct design — it is what stops JavaScript expecting a native module the installed app does not contain.</p>\n                        <p>It also means a version bump in the wrong place is a silent, total delivery failure. The app config had been moved to 2.1.0 while the build in the store was 2.0.1. A publish from that state completes without warning, reports success, and lands on a runtime that no installed device has. Every user stays on the old code, indefinitely, and the dashboard says the update shipped.</p>\n                        <p>There is a matching trap one layer down: adding a native module in JavaScript without shipping a binary that contains it produces an update that installs and then crashes on the code path that needs it — a break introduced by the delivery mechanism itself.</p>\n                        <p>Both are now procedural rather than remembered. Runtime version is verified against the shipped build before any publish, native-module changes are pinned to a matching binary release, and a type check gates the publish so a broken bundle cannot reach the channel in the first place.</p>\n                        <aside class=\"case-lesson\">\n                            <span class=\"case-lesson-label\">What it taught us</span>\n                            <p>For anything with an installed base, &quot;did it publish&quot; and &quot;did it arrive&quot; are different questions with different answers. The second one needs its own check, because the first one will happily report success.</p>\n                        </aside>\n                    </section>\n                </div>\n            </details>\n        </div>\n\n        \n        <nav class=\"case-nav\">\n            <div class=\"container case-narrow case-nav-inner\">\n                <a class=\"case-nav-item prev\" href=\"/work/bilingual-booking-platform\">\n                    <span class=\"case-nav-dir\">Previous</span>\n                    <span class=\"case-nav-name\">Bilingual therapeutic-riding booking platform</span>\n                </a>\n                <a class=\"case-nav-item next\" href=\"/work/claude-code-desk\">\n                    <span class=\"case-nav-dir\">Next</span>\n                    <span class=\"case-nav-name\">Claude Code Desk &amp; Mobile</span>\n                </a>\n            </div>\n        </nav>\n    </article>\n    \n    <section class=\"section cta-band\">\n        <div class=\"container\">\n            <div class=\"cta-band-inner\">\n                <h2>Got something shaped like this?</h2>\n                <p>Tell us what it is and what has stopped working. We will tell you what we would build.</p>\n                <div class=\"cta-band-actions\">\n                    <a href=\"/#contact\" class=\"btn btn-primary\" data-track=\"cta-band-contact\">Start a conversation</a>\n                    <a href=\"/work\" class=\"btn btn-secondary\" data-track=\"cta-band-work\">See more work</a>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <footer class=\"footer\">\n        <div class=\"container footer-inner\">\n            <div class=\"footer-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </div>\n            <div class=\"footer-links\">\n                <a href=\"/work\">Work</a>\n                <a href=\"/#practice\">What we do</a>\n                <a href=\"/#contact\">Contact</a>\n            </div>\n            <div class=\"footer-copy\">&copy; 2026 Kaymen Group LLC</div>\n        </div>\n    </footer>\n    <!--SCRIPT-->\n</body>\n</html>"},{"id":"claude-code-desk","label":"Claude Code Desk & Mobile","group":"Platforms","path":"/work/claude-code-desk","html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Claude Code Desk &amp; Mobile — kaymen.dev</title>\n    <meta name=\"description\" content=\"The internal tool the rest of this portfolio is built in.\">\n    <link rel=\"canonical\" href=\"https://kaymen.dev/work/claude-code-desk\">\n    <meta property=\"og:type\" content=\"article\">\n    <meta property=\"og:url\" content=\"https://kaymen.dev/work/claude-code-desk\">\n    <meta property=\"og:site_name\" content=\"kaymen.dev\">\n    <meta property=\"og:title\" content=\"Claude Code Desk &amp; Mobile — kaymen.dev\">\n    <meta property=\"og:description\" content=\"The internal tool the rest of this portfolio is built in.\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n    <meta name=\"twitter:title\" content=\"Claude Code Desk &amp; Mobile — kaymen.dev\">\n    <meta name=\"twitter:description\" content=\"The internal tool the rest of this portfolio is built in.\">\n    <meta name=\"theme-color\" content=\"#09090b\">\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n    <!--STYLE-->\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+DQogIDxkZWZzPg0KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMTAwJSI+DQogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjM2I4MmY2Ii8+DQogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM4YjVjZjYiLz4NCiAgICA8L2xpbmVhckdyYWRpZW50Pg0KICA8L2RlZnM+DQogIDxyZWN0IHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgcng9IjgiIGZpbGw9IiMwOTA5MGIiLz4NCiAgPHRleHQgeD0iNCIgeT0iMjMiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtd2VpZ2h0PSI3MDAiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9InVybCgjZykiPks8L3RleHQ+DQogIDxjaXJjbGUgY3g9IjI0IiBjeT0iMTAiIHI9IjMiIGZpbGw9InVybCgjZykiIG9wYWNpdHk9IjAuNiIvPg0KPC9zdmc+DQo=\">\n</head>\n<body>\n\n    <nav class=\"nav\" id=\"nav\">\n        <div class=\"nav-inner\">\n            <a href=\"/\" class=\"nav-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </a>\n            <div class=\"nav-links\" id=\"navLinks\">\n                <a href=\"/#work\" data-track=\"nav-work\">Work</a>\n                <a href=\"/#practice\" data-track=\"nav-practice\">What we do</a>\n                <a href=\"/#process\" data-track=\"nav-process\">Process</a>\n                <a href=\"/#contact\" class=\"nav-cta\" data-track=\"nav-contact\">Let's Talk</a>\n            </div>\n            <button class=\"theme-toggle\" id=\"themeToggle\" aria-label=\"Toggle theme\">\n                <svg class=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><circle cx=\"12\" cy=\"12\" r=\"5\"/><path d=\"M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\"/></svg>\n                <svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><path d=\"M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z\"/></svg>\n            </button>\n            <button class=\"nav-hamburger\" id=\"hamburger\" aria-label=\"Toggle menu\">\n                <span></span><span></span><span></span>\n            </button>\n        </div>\n    </nav>\n\n    <article class=\"case\">\n        <header class=\"case-hero\">\n            <div class=\"container case-narrow\">\n                <a class=\"case-back\" href=\"/work\" data-track=\"case-back\">\n                    <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z\"/></svg>\n                    All work\n                </a>\n                <div class=\"case-meta\">\n                    <span class=\"case-area\">Multi-tenant platforms</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-status\">Live — desktop app + installable PWA</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-year\">2026</span>\n                </div>\n                <h1>Claude Code Desk &amp; Mobile</h1>\n                <p class=\"case-tagline\">The internal tool the rest of this portfolio is built in.</p>\n                <p class=\"case-summary\">A desktop and mobile interface for running AI coding sessions across every project on one machine — built because the alternative was a wall of terminals, and kept because it is now the delivery environment for everything else here.</p>\n                \n                <div class=\"case-scale\">\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">25+</span>\n                        <span class=\"case-scale-label\">projects driven from one interface</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">Desktop + PWA</span>\n                        <span class=\"case-scale-label\">same session, either device</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">Push</span>\n                        <span class=\"case-scale-label\">notified when a run needs input</span>\n                    </div>\n                </div>\n            </div>\n        </header>\n\n        <div class=\"container case-narrow case-body\">\n            <figure class=\"demo\" data-demo=\"taskid\">\n    <figcaption class=\"demo-head\">\n        <span class=\"demo-tag\">Interactive — try it</span>\n        <h3 class=\"demo-title\">Watch the progress panel stay at zero.</h3>\n        <p class=\"demo-kicker\">The task id is assigned in the tool result, not in the call that announces it.</p>\n    </figcaption>\n    <div class=\"demo-body\">\n    <div class=\"demo-switch wide\" role=\"group\" aria-label=\"Correlation strategy\">\n        <button type=\"button\" data-key=\"naive\" aria-pressed=\"true\">\n            <span class=\"sw-name\">Key on the announcement</span><span class=\"sw-sub\">what the panel did</span>\n        </button>\n        <button type=\"button\" data-key=\"fixed\" aria-pressed=\"false\">\n            <span class=\"sw-name\">Thread the tool-use id</span><span class=\"sw-sub\">re-key when the real id lands</span>\n        </button>\n    </div>\n\n    <button type=\"button\" class=\"demo-action\" data-run>Run a turn</button>\n\n    <div class=\"demo-split\">\n        <div class=\"demo-stream\">\n            <span class=\"demo-col-label\">event stream</span>\n            <div data-out=\"stream\"></div>\n        </div>\n        <div class=\"demo-panel\">\n            <span class=\"demo-col-label\">tasks panel</span>\n            <div class=\"demo-panel-count\"><span data-out=\"done\">0</span> / <span data-out=\"total\">5</span></div>\n            <div class=\"demo-panel-bar\"><span data-out=\"panelbar\"></span></div>\n            <div class=\"demo-dropped\" data-out=\"dropped\"></div>\n        </div>\n    </div></div>\n    <p class=\"demo-caption\">Nothing errors. Updates arrive carrying the real id and land against keys that do not exist yet, so they are silently discarded and the panel reports 0 of 5 until the turn ends. When updates go missing without erroring, the bug is almost always a key that has not been created — not a message that never arrived.</p>\n</figure>\n\n            <section class=\"case-glance\">\n                <div class=\"glance-col\">\n                    <h2>The problem</h2>\n                    <ul class=\"glance-list\"><li>Two dozen repositories, each with long-running AI coding sessions.</li><li>Raw terminals give no searchable history and no view of which run is waiting on you.</li><li>A run that stalls while you are elsewhere costs the whole gap until you look.</li></ul>\n                </div>\n                <div class=\"glance-col\">\n                    <h2>What we built</h2>\n                    <ul class=\"glance-list glance-check\"><li>An Electron desktop app and an installable PWA sharing one server, so a session started on the desktop is readable from a phone.</li><li>A headless server that starts at boot as a scheduled task before login, which the desktop app attaches to rather than spawning its own.</li><li>Web push on session state changes — waiting, done, or errored — so a stalled run announces itself.</li><li>Local voice transcription for dictated input.</li></ul>\n                </div>\n            </section>\n\n            <section class=\"case-outcome\">\n                <h2>Outcome</h2>\n                <ul class=\"case-list case-list-check\"><li>Every project in this portfolio is now driven from one interface, desktop or phone.</li><li>Long runs are monitored by notification rather than by watching.</li><li>Task progress is live, which is the only time it is worth anything.</li></ul>\n                <div class=\"case-stack\">\n                    <span>Electron</span><span>Node.js</span><span>PWA / Service Workers</span><span>Web Push</span><span>Whisper</span><span>WebSockets</span>\n                </div>\n            </section>\n\n            <details class=\"case-longform\">\n                <summary>\n                    <span class=\"lf-title\">The full write-up</span>\n                    <span class=\"lf-sub\">problem, constraints, and the whole debugging story — about a 4-minute read</span>\n                </summary>\n                <div class=\"lf-body\">\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">01</span> The problem</h3>\n                        <p>Running AI-assisted development across two dozen repositories means a lot of parallel, long-running sessions. In raw terminals that is unmanageable: no history worth searching, no way to see which run is waiting on you, and no access at all from a phone.</p>\n                        <p>The specific failure was attention. A run that finishes or stalls while you are elsewhere costs the whole gap until you happen to look.</p>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">02</span> Constraints</h3>\n                        <ul class=\"case-list\"><li>It had to work off the machine — the phone client is not a demo, it is how sessions get checked from outside the office.</li><li>Streaming output is heavy. Naive rendering of a live token stream will pin a CPU and make the interface worse than the terminal it replaced.</li><li>The desktop app is packaged. Deployment is not &quot;save the file.&quot;</li></ul>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">03</span> What we built</h3>\n                        <ul class=\"case-list case-list-check\"><li>An Electron desktop app and an installable PWA sharing one server, so a session started on the desktop is readable from a phone.</li><li>A headless server that starts at boot as a scheduled task before login, which the desktop app attaches to rather than spawning its own.</li><li>Web push on session state changes — waiting, done, or errored — so a stalled run announces itself.</li><li>Local voice transcription for dictated input.</li><li>Progressive streaming, markdown rendering moved to a Web Worker, batched git status, and scroll coalescing — the difference between usable and unusable on a long session.</li></ul>\n                    </section>\n                    <section class=\"case-section case-hard\">\n                        <div class=\"case-hard-tag\">The hard part, in full</div>\n                        <h3>The identifier you need is not where the event is</h3>\n                        <p>The task panel — the thing that shows how much of a long run is done — sat at 0 of N for the entire session and then jumped to complete at the end. Useless precisely when progress information is worth having.</p>\n                        <p>The cause was an ordering assumption. Task creation is announced as a tool call, but the real task identifier is only assigned in the tool <strong>result</strong>. Every subsequent update carried that real id, matched nothing in a panel keyed on the announcement, and was silently dropped. Nothing errored — updates simply landed against keys that did not exist yet.</p>\n                        <p>The fix threads the tool-use id through from the server so the result can be tied back to the call that produced it, and re-keys the panel when the real identifier arrives. Both clients had to agree on this, since they share a stream.</p>\n                        <p>The deployment trap is worth naming too, because it wastes an hour every time it is forgotten: the desktop app ships as a packaged archive, so editing source changes nothing until the archive is extracted, patched and repacked. A change that appears to do nothing is usually a change that was never actually deployed.</p>\n                        <aside class=\"case-lesson\">\n                            <span class=\"case-lesson-label\">What it taught us</span>\n                            <p>When updates go missing without erroring, the bug is almost always a key that does not exist yet rather than a message that never arrived. Correlating on an id that is assigned later means threading it back, not guessing it earlier.</p>\n                        </aside>\n                    </section>\n                </div>\n            </details>\n        </div>\n\n        \n        <nav class=\"case-nav\">\n            <div class=\"container case-narrow case-nav-inner\">\n                <a class=\"case-nav-item prev\" href=\"/work/torah-tracker\">\n                    <span class=\"case-nav-dir\">Previous</span>\n                    <span class=\"case-nav-name\">Torah Tracker</span>\n                </a>\n                <a class=\"case-nav-item next\" href=\"/work/multi-campus-engagement-platform\">\n                    <span class=\"case-nav-dir\">Next</span>\n                    <span class=\"case-nav-name\">Multi-campus engagement platform</span>\n                </a>\n            </div>\n        </nav>\n    </article>\n    \n    <section class=\"section cta-band\">\n        <div class=\"container\">\n            <div class=\"cta-band-inner\">\n                <h2>Got something shaped like this?</h2>\n                <p>Tell us what it is and what has stopped working. We will tell you what we would build.</p>\n                <div class=\"cta-band-actions\">\n                    <a href=\"/#contact\" class=\"btn btn-primary\" data-track=\"cta-band-contact\">Start a conversation</a>\n                    <a href=\"/work\" class=\"btn btn-secondary\" data-track=\"cta-band-work\">See more work</a>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <footer class=\"footer\">\n        <div class=\"container footer-inner\">\n            <div class=\"footer-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </div>\n            <div class=\"footer-links\">\n                <a href=\"/work\">Work</a>\n                <a href=\"/#practice\">What we do</a>\n                <a href=\"/#contact\">Contact</a>\n            </div>\n            <div class=\"footer-copy\">&copy; 2026 Kaymen Group LLC</div>\n        </div>\n    </footer>\n    <!--SCRIPT-->\n</body>\n</html>"}];
const SITE_CSS = "﻿/* ============================================\r\n   KAHALANY.DEV â€” Portfolio Site Styles\r\n   ============================================ */\r\n\r\n/* --- Reset & Base --- */\r\n*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }\r\n\r\n:root {\r\n    --bg: #09090b;\r\n    --bg-elevated: #18181b;\r\n    --bg-card: #1c1c21;\r\n    --bg-card-hover: #232329;\r\n    --border: #27272a;\r\n    --border-light: #3f3f46;\r\n    --text: #fafafa;\r\n    --text-secondary: #a1a1aa;\r\n    --text-muted: #71717a;\r\n    --accent: #3b82f6;\r\n    --accent-glow: rgba(59, 130, 246, 0.15);\r\n    --gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);\r\n    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\r\n    --mono: 'JetBrains Mono', monospace;\r\n    --radius: 12px;\r\n    --radius-sm: 8px;\r\n    --radius-xs: 6px;\r\n    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);\r\n}\r\n\r\n/* --- Light Theme --- */\r\n[data-theme=\"light\"] {\r\n    --bg: #ffffff;\r\n    --bg-elevated: #f4f4f5;\r\n    --bg-card: #fafafa;\r\n    --bg-card-hover: #f0f0f2;\r\n    --border: #e4e4e7;\r\n    --border-light: #d4d4d8;\r\n    --text: #18181b;\r\n    --text-secondary: #52525b;\r\n    --text-muted: #71717a;\r\n    --accent: #2563eb;\r\n    --accent-glow: rgba(37, 99, 235, 0.1);\r\n    --gradient: linear-gradient(135deg, #2563eb, #7c3aed);\r\n}\r\n[data-theme=\"light\"] .nav.scrolled {\r\n    background: rgba(255, 255, 255, 0.9);\r\n    border-color: var(--border);\r\n}\r\n[data-theme=\"light\"] .nav-links.open {\r\n    background: rgba(255, 255, 255, 0.98);\r\n}\r\n[data-theme=\"light\"] .hero-bg .grid-lines {\r\n    background-image:\r\n        linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),\r\n        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);\r\n}\r\n[data-theme=\"light\"] .code-block {\r\n    background: #f8f9fa;\r\n    border-color: var(--border);\r\n}\r\n[data-theme=\"light\"] .code-block code { color: #1f2937; }\r\n[data-theme=\"light\"] .code-header { background: rgba(0,0,0,0.03); }\r\n[data-theme=\"light\"] .mockup-screen { background: #f0f1f3; }\r\n\r\n/* Theme toggle */\r\n.theme-toggle {\r\n    background: none;\r\n    border: 1px solid var(--border);\r\n    border-radius: 50%;\r\n    width: 36px;\r\n    height: 36px;\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: center;\r\n    cursor: pointer;\r\n    color: var(--text-muted);\r\n    transition: var(--transition);\r\n    margin-left: 8px;\r\n}\r\n.theme-toggle:hover { color: var(--text); border-color: var(--accent); }\r\n.icon-moon { display: block; }\r\n.icon-sun { display: none; }\r\n[data-theme=\"light\"] .icon-moon { display: none; }\r\n[data-theme=\"light\"] .icon-sun { display: block; }\r\n\r\nhtml { scroll-behavior: smooth; scroll-padding-top: 80px; }\r\nbody {\r\n    font-family: var(--font);\r\n    background: var(--bg);\r\n    color: var(--text);\r\n    line-height: 1.6;\r\n    -webkit-font-smoothing: antialiased;\r\n    overflow-x: hidden;\r\n}\r\n\r\na { color: inherit; text-decoration: none; }\r\nimg { max-width: 100%; display: block; }\r\n\r\n.container {\r\n    max-width: 1200px;\r\n    margin: 0 auto;\r\n    padding: 0 24px;\r\n}\r\n\r\n/* --- NAV --- */\r\n.nav {\r\n    position: fixed;\r\n    top: 0;\r\n    left: 0;\r\n    right: 0;\r\n    z-index: 1000;\r\n    padding: 16px 0;\r\n    transition: var(--transition);\r\n    background: transparent;\r\n}\r\n.nav.scrolled {\r\n    background: rgba(9, 9, 11, 0.85);\r\n    backdrop-filter: blur(20px);\r\n    -webkit-backdrop-filter: blur(20px);\r\n    border-bottom: 1px solid var(--border);\r\n    padding: 12px 0;\r\n}\r\n.nav-inner {\r\n    max-width: 1200px;\r\n    margin: 0 auto;\r\n    padding: 0 24px;\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: space-between;\r\n}\r\n.nav-logo {\r\n    font-family: var(--mono);\r\n    font-size: 1.1rem;\r\n    font-weight: 500;\r\n    letter-spacing: -0.02em;\r\n}\r\n.logo-bracket { color: var(--text-muted); }\r\n.logo-dot { color: var(--accent); }\r\n\r\n.nav-links {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 32px;\r\n}\r\n.nav-links a {\r\n    font-size: 0.9rem;\r\n    color: var(--text-secondary);\r\n    transition: var(--transition);\r\n    font-weight: 400;\r\n}\r\n.nav-links a:hover { color: var(--text); }\r\n\r\n.nav-cta {\r\n    background: var(--gradient) !important;\r\n    color: white !important;\r\n    padding: 8px 20px !important;\r\n    border-radius: 100px;\r\n    font-weight: 500 !important;\r\n    font-size: 0.85rem !important;\r\n}\r\n.nav-cta:hover { opacity: 0.9; }\r\n\r\n.nav-hamburger {\r\n    display: none;\r\n    flex-direction: column;\r\n    gap: 5px;\r\n    background: none;\r\n    border: none;\r\n    cursor: pointer;\r\n    padding: 4px;\r\n}\r\n.nav-hamburger span {\r\n    display: block;\r\n    width: 24px;\r\n    height: 2px;\r\n    background: var(--text);\r\n    border-radius: 2px;\r\n    transition: var(--transition);\r\n}\r\n.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }\r\n.nav-hamburger.open span:nth-child(2) { opacity: 0; }\r\n.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }\r\n\r\n/* --- HERO --- */\r\n.hero {\r\n    min-height: 100vh;\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: center;\r\n    position: relative;\r\n    overflow: hidden;\r\n    padding: 120px 24px 80px;\r\n}\r\n.hero-bg {\r\n    position: absolute;\r\n    inset: 0;\r\n    overflow: hidden;\r\n}\r\n.grid-lines {\r\n    position: absolute;\r\n    inset: 0;\r\n    background-image:\r\n        linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),\r\n        linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);\r\n    background-size: 60px 60px;\r\n    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);\r\n    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);\r\n}\r\n.hero-bg::after {\r\n    content: '';\r\n    position: absolute;\r\n    top: 20%;\r\n    left: 50%;\r\n    transform: translateX(-50%);\r\n    width: 600px;\r\n    height: 600px;\r\n    background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);\r\n    border-radius: 50%;\r\n}\r\n\r\n.hero-content {\r\n    position: relative;\r\n    text-align: center;\r\n    max-width: 800px;\r\n}\r\n.hero-badge {\r\n    display: inline-flex;\r\n    align-items: center;\r\n    gap: 8px;\r\n    padding: 6px 16px;\r\n    border-radius: 100px;\r\n    border: 1px solid var(--border);\r\n    background: var(--bg-elevated);\r\n    font-size: 0.8rem;\r\n    color: var(--text-secondary);\r\n    margin-bottom: 32px;\r\n    letter-spacing: 0.03em;\r\n}\r\n.hero-badge::before {\r\n    content: '';\r\n    width: 8px;\r\n    height: 8px;\r\n    border-radius: 50%;\r\n    background: #22c55e;\r\n    animation: pulse-dot 2s ease-in-out infinite;\r\n}\r\n\r\n@keyframes pulse-dot {\r\n    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }\r\n    50% { opacity: 0.8; box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }\r\n}\r\n\r\n.hero h1 {\r\n    font-size: clamp(2.8rem, 6vw, 4.5rem);\r\n    font-weight: 800;\r\n    line-height: 1.1;\r\n    letter-spacing: -0.03em;\r\n    margin-bottom: 24px;\r\n}\r\n.hero-highlight {\r\n    background: var(--gradient);\r\n    -webkit-background-clip: text;\r\n    -webkit-text-fill-color: transparent;\r\n    background-clip: text;\r\n}\r\n.hero-sub {\r\n    font-size: clamp(1rem, 2vw, 1.2rem);\r\n    color: var(--text-secondary);\r\n    max-width: 600px;\r\n    margin: 0 auto 48px;\r\n    line-height: 1.7;\r\n}\r\n\r\n.hero-stats {\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: center;\r\n    gap: 40px;\r\n    margin-bottom: 48px;\r\n}\r\n.stat { text-align: center; }\r\n.stat-num {\r\n    font-size: 2.5rem;\r\n    font-weight: 700;\r\n    letter-spacing: -0.02em;\r\n    display: inline;\r\n}\r\n.stat-plus {\r\n    font-size: 2rem;\r\n    font-weight: 600;\r\n    color: var(--accent);\r\n}\r\n.stat-label {\r\n    display: block;\r\n    font-size: 0.8rem;\r\n    color: var(--text-muted);\r\n    text-transform: uppercase;\r\n    letter-spacing: 0.08em;\r\n    margin-top: 4px;\r\n}\r\n.stat-divider {\r\n    width: 1px;\r\n    height: 40px;\r\n    background: var(--border);\r\n}\r\n\r\n.hero-actions {\r\n    display: flex;\r\n    gap: 16px;\r\n    justify-content: center;\r\n    flex-wrap: wrap;\r\n}\r\n\r\n.btn {\r\n    display: inline-flex;\r\n    align-items: center;\r\n    gap: 8px;\r\n    padding: 14px 28px;\r\n    border-radius: 100px;\r\n    font-size: 0.95rem;\r\n    font-weight: 500;\r\n    transition: var(--transition);\r\n    cursor: pointer;\r\n    border: none;\r\n    font-family: var(--font);\r\n}\r\n.btn-primary {\r\n    background: var(--gradient);\r\n    color: white;\r\n}\r\n.btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }\r\n.btn-secondary {\r\n    background: transparent;\r\n    color: var(--text);\r\n    border: 1px solid var(--border-light);\r\n}\r\n.btn-secondary:hover { border-color: var(--text-muted); background: var(--bg-elevated); }\r\n\r\n.hero-scroll {\r\n    position: absolute;\r\n    bottom: 40px;\r\n    left: 50%;\r\n    transform: translateX(-50%);\r\n}\r\n.scroll-line {\r\n    width: 1px;\r\n    height: 60px;\r\n    background: linear-gradient(to bottom, var(--accent), transparent);\r\n    animation: scroll-pulse 2s ease-in-out infinite;\r\n}\r\n@keyframes scroll-pulse {\r\n    0%, 100% { opacity: 0.3; }\r\n    50% { opacity: 1; }\r\n}\r\n\r\n/* --- SECTIONS --- */\r\n.section {\r\n    padding: 120px 0;\r\n}\r\n.section-header {\r\n    text-align: center;\r\n    margin-bottom: 64px;\r\n}\r\n.section-tag {\r\n    display: inline-block;\r\n    font-size: 0.8rem;\r\n    font-weight: 500;\r\n    color: var(--accent);\r\n    text-transform: uppercase;\r\n    letter-spacing: 0.12em;\r\n    margin-bottom: 16px;\r\n    font-family: var(--mono);\r\n}\r\n.section-header h2 {\r\n    font-size: clamp(2rem, 4vw, 3rem);\r\n    font-weight: 700;\r\n    letter-spacing: -0.02em;\r\n    margin-bottom: 16px;\r\n    line-height: 1.2;\r\n}\r\n.section-header h2 em {\r\n    font-style: normal;\r\n    background: var(--gradient);\r\n    -webkit-background-clip: text;\r\n    -webkit-text-fill-color: transparent;\r\n    background-clip: text;\r\n}\r\n.section-header p {\r\n    color: var(--text-secondary);\r\n    font-size: 1.1rem;\r\n    max-width: 500px;\r\n    margin: 0 auto;\r\n}\r\n\r\n/* --- PROJECT FILTERS --- */\r\n.project-filters {\r\n    display: flex;\r\n    justify-content: center;\r\n    gap: 8px;\r\n    margin-bottom: 48px;\r\n    flex-wrap: wrap;\r\n}\r\n.filter-btn {\r\n    padding: 8px 20px;\r\n    border-radius: 100px;\r\n    border: 1px solid var(--border);\r\n    background: transparent;\r\n    color: var(--text-secondary);\r\n    font-size: 0.85rem;\r\n    font-family: var(--font);\r\n    cursor: pointer;\r\n    transition: var(--transition);\r\n}\r\n.filter-btn:hover { border-color: var(--text-muted); color: var(--text); }\r\n.filter-btn.active {\r\n    background: var(--gradient);\r\n    border-color: transparent;\r\n    color: white;\r\n}\r\n\r\n/* --- PROJECT CARDS --- */\r\n.projects-grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(2, 1fr);\r\n    gap: 24px;\r\n}\r\n.project-card {\r\n    background: var(--bg-card);\r\n    border: 1px solid var(--border);\r\n    border-radius: var(--radius);\r\n    overflow: hidden;\r\n    transition: var(--transition);\r\n    opacity: 1;\r\n}\r\n.project-card:hover {\r\n    border-color: var(--border-light);\r\n    transform: translateY(-4px);\r\n    box-shadow: 0 20px 40px rgba(0,0,0,0.3);\r\n}\r\n.project-card.hidden { display: none; }\r\n.project-card.showcase {\r\n    display: flex;\r\n    flex-direction: column;\r\n}\r\n\r\n/* Project body */\r\n.project-body { padding: 24px; }\r\n.project-meta {\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: space-between;\r\n    margin-bottom: 12px;\r\n}\r\n.project-tags {\r\n    display: flex;\r\n    flex-wrap: wrap;\r\n    gap: 6px;\r\n}\r\n.project-tags span {\r\n    font-size: 0.7rem;\r\n    padding: 3px 10px;\r\n    border-radius: 100px;\r\n    background: rgba(59, 130, 246, 0.1);\r\n    color: #60a5fa;\r\n    font-family: var(--mono);\r\n    font-weight: 400;\r\n}\r\n.project-badge {\r\n    padding: 4px 12px;\r\n    border-radius: 100px;\r\n    font-size: 0.7rem;\r\n    font-weight: 600;\r\n    text-transform: uppercase;\r\n    letter-spacing: 0.08em;\r\n    background: rgba(34, 197, 94, 0.15);\r\n    color: #22c55e;\r\n    border: 1px solid rgba(34, 197, 94, 0.2);\r\n    flex-shrink: 0;\r\n}\r\n.project-badge.purple { background: rgba(139,92,246,0.15); color: #a78bfa; border-color: rgba(139,92,246,0.2); }\r\n.project-badge.amber { background: rgba(245,158,11,0.15); color: #fbbf24; border-color: rgba(245,158,11,0.2); }\r\n.project-badge.red { background: rgba(239,68,68,0.15); color: #f87171; border-color: rgba(239,68,68,0.2); }\r\n.project-badge.magenta { background: rgba(217,70,239,0.15); color: #e879f9; border-color: rgba(217,70,239,0.2); }\r\n.project-badge.orange { background: rgba(249,115,22,0.15); color: #fb923c; border-color: rgba(249,115,22,0.2); }\r\n.project-badge.pink { background: rgba(236,72,153,0.15); color: #f472b6; border-color: rgba(236,72,153,0.2); }\r\n\r\n.project-body h3 {\r\n    font-size: 1.3rem;\r\n    font-weight: 600;\r\n    margin-bottom: 10px;\r\n    letter-spacing: -0.01em;\r\n}\r\n.project-body p {\r\n    color: var(--text-secondary);\r\n    font-size: 0.9rem;\r\n    line-height: 1.65;\r\n    margin-bottom: 16px;\r\n}\r\n.project-features {\r\n    display: flex;\r\n    flex-wrap: wrap;\r\n    gap: 6px;\r\n    margin-bottom: 16px;\r\n}\r\n.project-features span {\r\n    font-size: 0.72rem;\r\n    padding: 4px 10px;\r\n    border-radius: var(--radius-xs);\r\n    background: var(--bg-elevated);\r\n    color: var(--text-muted);\r\n    border: 1px solid var(--border);\r\n}\r\n.project-link {\r\n    display: inline-flex;\r\n    align-items: center;\r\n    gap: 6px;\r\n    font-size: 0.85rem;\r\n    font-weight: 500;\r\n    color: var(--text-secondary);\r\n    transition: var(--transition);\r\n}\r\n.project-link:hover { color: var(--text); }\r\n.project-link svg { transition: transform 0.2s ease; }\r\n.project-link:hover svg { transform: translate(2px, -2px); }\r\n\r\n/* =============================================\r\n   MOCKUP: Browser Chrome\r\n   ============================================= */\r\n.mockup-browser {\r\n    border-bottom: 1px solid var(--border);\r\n}\r\n.mockup-chrome {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 6px;\r\n    padding: 10px 14px;\r\n    background: #111114;\r\n    border-bottom: 1px solid rgba(255,255,255,0.06);\r\n}\r\n.dot { width: 10px; height: 10px; border-radius: 50%; }\r\n.dot.r { background: #ef4444; }\r\n.dot.y { background: #f59e0b; }\r\n.dot.g { background: #22c55e; }\r\n.mockup-url {\r\n    margin-left: 10px;\r\n    font-size: 0.7rem;\r\n    font-family: var(--mono);\r\n    color: var(--text-muted);\r\n    background: rgba(255,255,255,0.04);\r\n    padding: 3px 12px;\r\n    border-radius: 4px;\r\n    flex: 1;\r\n    max-width: 250px;\r\n}\r\n\r\n/* Mockup screen base */\r\n.mockup-screen {\r\n    display: flex;\r\n    height: 240px;\r\n    background: #0d0d10;\r\n    overflow: hidden;\r\n}\r\n\r\n/* =============================================\r\n   MOCKUP: Shared Components\r\n   ============================================= */\r\n/* Sidebar */\r\n.m-sidebar {\r\n    width: 52px;\r\n    background: #111116;\r\n    border-right: 1px solid rgba(255,255,255,0.06);\r\n    padding: 10px 8px;\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 6px;\r\n    flex-shrink: 0;\r\n}\r\n.m-logo-bar {\r\n    width: 100%;\r\n    height: 20px;\r\n    border-radius: 4px;\r\n    background: rgba(255,255,255,0.06);\r\n    margin-bottom: 8px;\r\n}\r\n.m-nav-item {\r\n    width: 100%;\r\n    height: 8px;\r\n    border-radius: 3px;\r\n    background: rgba(255,255,255,0.06);\r\n}\r\n.m-nav-item.active {\r\n    background: var(--m-accent, #3b82f6);\r\n    opacity: 0.7;\r\n}\r\n.m-sidebar.purple .m-nav-item.active { background: #8b5cf6; }\r\n.m-sidebar.red .m-nav-item.active { background: #ef4444; }\r\n.m-sidebar.magenta .m-nav-item.active { background: #d946ef; }\r\n.m-sidebar.dark { background: #0a0a0e; }\r\n\r\n/* Main area */\r\n.m-main {\r\n    flex: 1;\r\n    padding: 12px;\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 10px;\r\n    overflow: hidden;\r\n}\r\n.m-main.full { padding: 0; }\r\n.m-main.dark { background: #08080c; }\r\n.m-topbar {\r\n    height: 10px;\r\n    border-radius: 4px;\r\n    background: rgba(255,255,255,0.04);\r\n    width: 40%;\r\n}\r\n.m-topbar.wide { width: 60%; }\r\n.m-topbar.amber { width: 100%; height: 6px; background: rgba(245,158,11,0.2); }\r\n\r\n/* Stat cards row */\r\n.m-cards-row {\r\n    display: flex;\r\n    gap: 8px;\r\n}\r\n.m-stat-card {\r\n    flex: 1;\r\n    padding: 8px;\r\n    border-radius: 6px;\r\n    background: rgba(255,255,255,0.03);\r\n    border: 1px solid rgba(255,255,255,0.06);\r\n}\r\n.m-stat-card.accent { border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.06); }\r\n.m-stat-card.purple { border-color: rgba(139,92,246,0.3); background: rgba(139,92,246,0.06); }\r\n.m-stat-card.amber { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.06); }\r\n.m-stat-val { height: 12px; width: 50%; border-radius: 3px; background: rgba(255,255,255,0.12); margin-bottom: 4px; }\r\n.m-stat-lbl { height: 6px; width: 70%; border-radius: 2px; background: rgba(255,255,255,0.06); }\r\n.m-stat-icon {\r\n    font-size: 0.7rem;\r\n    font-weight: 700;\r\n    font-family: var(--mono);\r\n    color: rgba(255,
