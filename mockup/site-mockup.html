<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>kaymen.dev — site mockup</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bar:#141418;--bar2:#1c1c21;--line:#2b2b31;--txt:#fafafa;--dim:#8b8b94;--accent:#3b82f6}
  html,body{height:100%}
  body{background:#08080a;color:var(--txt);
       font:14px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  header{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
  .row{display:flex;align-items:center;gap:14px;padding:9px 14px;flex-wrap:wrap}
  .row+.row{border-top:1px solid var(--line)}
  .brand{font-family:ui-monospace,"JetBrains Mono",monospace;font-size:13px;color:var(--dim);white-space:nowrap}
  .brand b{color:var(--accent);font-weight:400}
  .tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#facc15;
       border:1px solid #facc1544;background:#facc1514;padding:3px 8px;border-radius:100px;white-space:nowrap}
  nav{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
         background:var(--bar2);color:var(--dim);padding:6px 11px;transition:.15s;white-space:nowrap}
  button:hover{color:var(--txt);border-color:#3f3f46}
  button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .grp{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#5b5b63;
       align-self:center;margin-left:6px}
  .grp:first-child{margin-left:0}
  .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:6px 12px}
  .seg button+button{border-left:1px solid var(--line)}
  .path{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);
        background:var(--bar2);border:1px solid var(--line);border-radius:7px;padding:6px 11px;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
  main{flex:1;min-height:0;display:flex;justify-content:center;background:#08080a;padding:14px;overflow:auto}
  .frame{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;
         width:100%;max-width:100%;height:100%;transition:max-width .2s;box-shadow:0 20px 60px -20px #000}
  iframe{width:100%;height:100%;border:0;display:block;background:#09090b}
  @media (max-width:720px){ .path{display:none} .grp{display:none} }
</style>
</head>

      <button data-w="100%" aria-current="true">Desktop</button>
      <button data-w="834px">Tablet</button>
      <button data-w="414px">Phone</button>
    </div>
    <div class="seg" id="themes">
      <button data-t="dark" aria-current="true">Dark</button>
      <button data-t="light">Light</button>
    </div>
  </div>
  <div class="row"><nav id="nav"></nav></div>
</header>
<main><div class="frame" id="frame"><iframe id="view" title="Site preview"></iframe></div></main>

const PAGES = [{"id":"home","label":"Home","group":"Site","path":"/","html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>kaymen.dev — Platforms, integrations and apps that hold up</title>\n    <meta name=\"description\" content=\"Multi-tenant platforms, hard integrations, and apps in the stores — architected, built, deployed and maintained by one team. Six case studies, each including what went wrong.\">\n    <link rel=\"canonical\" href=\"https://kaymen.dev/\">\n    <!-- Open Graph / social -->\n    <meta property=\"og:type\" content=\"website\">\n    <meta property=\"og:url\" content=\"https://kaymen.dev/\">\n    <meta property=\"og:site_name\" content=\"kaymen.dev\">\n    <meta property=\"og:title\" content=\"kaymen.dev — Platforms, integrations and apps that hold up\">\n    <meta property=\"og:description\" content=\"Multi-tenant platforms, hard integrations, apps in the stores. Six case studies — each one includes the part that broke and how we found it.\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n    <meta name=\"twitter:title\" content=\"kaymen.dev — Platforms, integrations and apps that hold up\">\n    <meta name=\"twitter:description\" content=\"Multi-tenant platforms, hard integrations, apps in the stores. Six case studies — each one includes the part that broke and how we found it.\">\n    <meta name=\"theme-color\" content=\"#09090b\">\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n    <!--STYLE-->\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+DQogIDxkZWZzPg0KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMTAwJSI+DQogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjM2I4MmY2Ii8+DQogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM4YjVjZjYiLz4NCiAgICA8L2xpbmVhckdyYWRpZW50Pg0KICA8L2RlZnM+DQogIDxyZWN0IHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgcng9IjgiIGZpbGw9IiMwOTA5MGIiLz4NCiAgPHRleHQgeD0iNCIgeT0iMjMiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtd2VpZ2h0PSI3MDAiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9InVybCgjZykiPks8L3RleHQ+DQogIDxjaXJjbGUgY3g9IjI0IiBjeT0iMTAiIHI9IjMiIGZpbGw9InVybCgjZykiIG9wYWNpdHk9IjAuNiIvPg0KPC9zdmc+DQo=\">\n</head>\n<body>\n    <!-- NAV -->\n    <nav class=\"nav\" id=\"nav\">\n        <div class=\"nav-inner\">\n            <a href=\"#\" class=\"nav-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </a>\n            <div class=\"nav-links\" id=\"navLinks\">\n                <a href=\"#work\" data-track=\"nav-work\">Work</a>\n                <a href=\"#practice\" data-track=\"nav-practice\">What we do</a>\n                <a href=\"#process\" data-track=\"nav-process\">Process</a>\n                <a href=\"#contact\" class=\"nav-cta\" data-track=\"nav-contact\">Let's Talk</a>\n            </div>\n            <button class=\"theme-toggle\" id=\"themeToggle\" aria-label=\"Toggle theme\">\n                <svg class=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><circle cx=\"12\" cy=\"12\" r=\"5\"/><path d=\"M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\"/></svg>\n                <svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><path d=\"M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z\"/></svg>\n            </button>\n            <button class=\"nav-hamburger\" id=\"hamburger\" aria-label=\"Toggle menu\">\n                <span></span><span></span><span></span>\n            </button>\n        </div>\n    </nav>\n\n    <!-- HERO -->\n    <section class=\"hero\" id=\"hero\">\n        <div class=\"hero-bg\">\n            <div class=\"grid-lines\"></div>\n        </div>\n        <div class=\"hero-content\">\n            <div class=\"hero-badge\">Available for new projects</div>\n            <h1>We build software<br>that <span class=\"hero-highlight\" id=\"rotatingText\">holds up</span></h1>\n            <p class=\"hero-sub\">Multi-tenant platforms, the integrations most shops decline, and apps in the stores — architected, built, deployed and maintained by the same people.</p>\n            <p class=\"hero-kicker\">Every case study below includes the part that went wrong, and how we found it.</p>\n            <div class=\"hero-actions\">\n                <a href=\"#work\" class=\"btn btn-primary\" data-track=\"cta-see-work\">See the work</a>\n                <a href=\"#contact\" class=\"btn btn-secondary\" data-track=\"cta-start-project\">Start a project</a>\n            </div>\n        </div>\n        <div class=\"hero-scroll\">\n            <div class=\"scroll-line\"></div>\n        </div>\n    </section>\n\n    <!-- WORK: evidence strip, practice areas, case studies, long tail -->\n    <!-- Server-rendered from content/projects.js by server/render.js -->\n    \n    <section class=\"evidence\" id=\"evidence\">\n        <div class=\"container\">\n            <div class=\"evidence-grid\">\n                <div class=\"evidence-item\">\n                    <span class=\"evidence-value\">20+</span>\n                    <span class=\"evidence-label\">apps in production</span>\n                    <span class=\"evidence-note\">Not prototypes — deployed, in use, maintained.</span>\n                </div>\n                <div class=\"evidence-item\">\n                    <span class=\"evidence-value\">4</span>\n                    <span class=\"evidence-label\">apps in the App Store &amp; Play</span>\n                    <span class=\"evidence-note\">Shipped, reviewed, and updated over the air.</span>\n                </div>\n                <div class=\"evidence-item\">\n                    <span class=\"evidence-value\">12+</span>\n                    <span class=\"evidence-label\">live platforms</span>\n                    <span class=\"evidence-note\">Self-hosted on infrastructure we run ourselves.</span>\n                </div>\n                <div class=\"evidence-item\">\n                    <span class=\"evidence-value\">1</span>\n                    <span class=\"evidence-label\">team, end to end</span>\n                    <span class=\"evidence-note\">Architecture, build, deploy and the 3am page.</span>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <section class=\"section practice\" id=\"practice\">\n        <div class=\"container\">\n            <div class=\"section-header\">\n                <span class=\"section-tag\">What we do</span>\n                <h2>Three kinds of problem, <em>done properly</em></h2>\n                <p>Most of this work is a replacement for something that stopped scaling — a spreadsheet, a legacy install, or six tools that don't talk. These are the three shapes it takes.</p>\n            </div>\n            <div class=\"practice-grid\">\n                <article class=\"practice-card\" id=\"practice-platforms\">\n                    <span class=\"practice-label\">Platforms</span>\n                    <h3>Multi-tenant platforms</h3>\n                    <p class=\"practice-promise\">One system, many organisations, isolation enforced at the database rather than hoped for in the application.</p>\n                    <p class=\"practice-detail\">The work is usually a replacement: an organisation outgrows a spreadsheet, a WordPress install, or six disconnected tools, and needs one platform that several groups can use without seeing each other. That means real tenancy, an audit trail, role and permission models, and a migration that runs while the old system is still live.</p>\n                    <ul class=\"practice-proof\">\n                        <li>Row-level security enforced in Postgres, verified in production</li>\n                        <li>Live migrations off legacy systems with no downtime window</li>\n                        <li>Per-tenant admin panels, HQ oversight across all tenants</li>\n                    </ul>\n                    <div class=\"practice-stack\">\n                        <span>Laravel</span><span>Filament</span><span>PostgreSQL</span><span>Livewire</span><span>Node/Express</span><span>MySQL</span>\n                    </div>\n                </article>\n                <article class=\"practice-card\" id=\"practice-integrations\">\n                    <span class=\"practice-label\">Integrations</span>\n                    <h3>Business systems &amp; integrations</h3>\n                    <p class=\"practice-promise\">The connective work most shops decline — two-way syncs, financial reconciliation, and APIs that were never designed for the question being asked.</p>\n                    <p class=\"practice-detail\">Every one of these started as &quot;can it just talk to X.&quot; X is usually Salesforce, QuickBooks, a PSA, a payment or shipping provider, or a calendar — and the honest answer is that the integration is the project. Rate limits, pagination ceilings, records that exist on one side and not the other, and a reconciliation story for when the two disagree.</p>\n                    <ul class=\"practice-proof\">\n                        <li>Two-way Salesforce sync — bridge objects, flow deploys via Metadata API</li>\n                        <li>Accounting reconciliation against a live book</li>\n                        <li>Delta-sync ingestion pipelines that survive API timeouts</li>\n                    </ul>\n                    <div class=\"practice-stack\">\n                        <span>Salesforce API</span><span>QuickBooks Online</span><span>Autotask REST</span><span>Shopify</span><span>Google Calendar</span><span>Python</span>\n                    </div>\n                </article>\n                <article class=\"practice-card\" id=\"practice-apps\">\n                    <span class=\"practice-label\">Apps</span>\n                    <h3>Consumer &amp; mobile apps</h3>\n                    <p class=\"practice-promise\">Native iOS and Android in the stores, plus the release discipline that keeps an update from reaching zero users.</p>\n                    <p class=\"practice-detail\">Shipping the first build is the easy half. The hard half is everything after: over-the-air updates that actually land on the installed base, native modules paired to the right binary, bilingual and right-to-left layouts, offline behaviour, and push notifications that arrive on the phones people actually own.</p>\n                    <ul class=\"practice-proof\">\n                        <li>Apps live in the App Store and Google Play with real users</li>\n                        <li>OTA update pipeline with runtime-version gating</li>\n                        <li>Full RTL/bilingual interfaces, not translated afterthoughts</li>\n                    </ul>\n                    <div class=\"practice-stack\">\n                        <span>React Native</span><span>Expo / EAS</span><span>Astro</span><span>Capacitor</span><span>Electron</span><span>PWA</span>\n                    </div>\n                </article>\n            </div>\n        </div>\n    </section>\n\n    <section class=\"section work\" id=\"work\">\n        <div class=\"container\">\n            <div class=\"section-header\">\n                <span class=\"section-tag\">Selected work</span>\n                <h2>Six builds, and <em>what was hard about each</em></h2>\n                <p>Every one of these includes the part that went wrong. That section is the point — it is the difference between a portfolio and a claim.</p>\n            </div>\n            <div class=\"study-grid\">\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/multi-campus-engagement-platform\" data-track=\"study-multi-campus-engagement-platform\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Platforms</span>\n                            <span class=\"study-status\">Live in production</span>\n                        </div>\n                        <h3>Multi-campus engagement platform</h3>\n                        <p class=\"study-tagline\">Four campuses, one database, isolation that had to be provably real.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">4</span><span class=\"scale-label\">campuses on one platform</span></div>\n                            <div><span class=\"scale-value\">135K</span><span class=\"scale-label\">lines of legacy code retired</span></div>\n                            <div><span class=\"scale-value\">2×/day</span><span class=\"scale-label\">Salesforce sync, zero duplicates</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">Row-level security that silently did nothing</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/community-lending-ledger\" data-track=\"study-community-lending-ledger\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Platforms</span>\n                            <span class=\"study-status\">Live in production</span>\n                        </div>\n                        <h3>Community lending ledger</h3>\n                        <p class=\"study-tagline\">A $1.58M interest-free loan fund whose headline number was wrong by $47,383.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">$1.58M</span><span class=\"scale-label\">fund reconciled to the bank</span></div>\n                            <div><span class=\"scale-value\">44</span><span class=\"scale-label\">lenders tracked individually</span></div>\n                            <div><span class=\"scale-value\">$47K</span><span class=\"scale-label\">previously-unexplained gap, resolved</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">The headline number was measuring the wrong side</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/msp-time-compliance-portal\" data-track=\"study-msp-time-compliance-portal\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Integrations</span>\n                            <span class=\"study-status\">Live in production</span>\n                        </div>\n                        <h3>MSP time-compliance portal</h3>\n                        <p class=\"study-tagline\">Billable hours were leaking. The API could not answer the question being asked.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">20,920</span><span class=\"scale-label\">tickets under delta sync</span></div>\n                            <div><span class=\"scale-value\">5,216</span><span class=\"scale-label\">time entries reconciled</span></div>\n                            <div><span class=\"scale-value\">10 min</span><span class=\"scale-label\">refresh interval</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">Designing around an API that cannot answer the question</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/bilingual-booking-platform\" data-track=\"study-bilingual-booking-platform\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Apps</span>\n                            <span class=\"study-status\">Live in production</span>\n                        </div>\n                        <h3>Bilingual therapeutic-riding booking platform</h3>\n                        <p class=\"study-tagline\">The booking calendar rendered perfectly, and it was empty.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">HE / EN</span><span class=\"scale-label\">full RTL and LTR</span></div>\n                            <div><span class=\"scale-value\">30 days</span><span class=\"scale-label\">rolling bookable horizon</span></div>\n                            <div><span class=\"scale-value\">0</span><span class=\"scale-label\">errors when it broke</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">A failure mode with no error state</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/torah-tracker\" data-track=\"study-torah-tracker\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Apps</span>\n                            <span class=\"study-status\">Live — App Store &amp; Google Play</span>\n                        </div>\n                        <h3>Torah Tracker</h3>\n                        <p class=\"study-tagline\">A rewrite shipped to an installed base, without reaching zero users.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">iOS + Android</span><span class=\"scale-label\">native, in both stores</span></div>\n                            <div><span class=\"scale-value\">OTA</span><span class=\"scale-label\">updates without a store round-trip</span></div>\n                            <div><span class=\"scale-value\">0</span><span class=\"scale-label\">users a mismatched update reaches</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">The update that publishes successfully to nobody</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/claude-code-desk\" data-track=\"study-claude-code-desk\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Platforms</span>\n                            <span class=\"study-status\">Live — desktop app + installable PWA</span>\n                        </div>\n                        <h3>Claude Code Desk &amp; Mobile</h3>\n                        <p class=\"study-tagline\">The internal tool the rest of this portfolio is built in.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">25+</span><span class=\"scale-label\">projects driven from one interface</span></div>\n                            <div><span class=\"scale-value\">Desktop + PWA</span><span class=\"scale-label\">same session, either device</span></div>\n                            <div><span class=\"scale-value\">Push</span><span class=\"scale-label\">notified when a run needs input</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">The identifier you need is not where the event is</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n            </div>\n        </div>\n    </section>\n\n    <section class=\"section more-work\" id=\"more\">\n        <div class=\"container\">\n            <details class=\"more-toggle\">\n                <summary>\n                    <span class=\"more-summary-text\">Everything else we've built</span>\n                    <span class=\"more-count\">12 more projects</span>\n                </summary>\n                <div class=\"more-grid\">\n                    <div class=\"more-col\">\n                        <h4>Multi-tenant platforms</h4>\n                        <ul>\n                            <li><span class=\"more-name\">Mortgage client portal</span><span class=\"more-note\">Application intake, document vault, broker pipeline</span></li>\n                            <li><span class=\"more-name\">Campus site builder</span><span class=\"more-note\">Drag-and-drop public sites, multi-tenant</span></li>\n                            <li><span class=\"more-name\"><a href=\"/portal\">Client project portal</a></span><span class=\"more-note\">Milestones, tickets and plan approval — this site runs it</span></li>\n                        </ul>\n                    </div>\n                    <div class=\"more-col\">\n                        <h4>Business systems &amp; integrations</h4>\n                        <ul>\n                            <li><span class=\"more-name\">Predictable</span><span class=\"more-note\">Stock curation &amp; analysis, live broker integration</span></li>\n                            <li><span class=\"more-name\">Same-day delivery network</span><span class=\"more-note\">Multi-carrier rate-shop injected into checkout</span></li>\n                            <li><span class=\"more-name\">Warehouse operations assistant</span><span class=\"more-note\">Natural-language interface over 3PL operations</span></li>\n                        </ul>\n                    </div>\n                    <div class=\"more-col\">\n                        <h4>Consumer &amp; mobile apps</h4>\n                        <ul>\n                            <li><span class=\"more-name\"><a href=\"https://davenen.org\" target=\"_blank\" rel=\"noopener\">Davenen</a><span class=\"more-badge\">App Store</span></span><span class=\"more-note\">Prayer-partner matching platform</span></li>\n                            <li><span class=\"more-name\"><a href=\"https://kartov.app\" target=\"_blank\" rel=\"noopener\">Kartov</a></span><span class=\"more-note\">Shared lists &amp; meal planning</span></li>\n                            <li><span class=\"more-name\">Temani Chacham<span class=\"more-badge\">App Store</span></span><span class=\"more-note\">Yemenite siddur with a rule-driven prayer engine</span></li>\n                            <li><span class=\"more-name\">TapSend</span><span class=\"more-note\">Bulk messaging with a manual send gate</span></li>\n                            <li><span class=\"more-name\">Investment firm site</span><span class=\"more-note\">Marketing site and content platform</span></li>\n                            <li><span class=\"more-name\">Advocacy campaign platform</span><span class=\"more-note\">Hebrew-first campaign site with media pipeline</span></li>\n                        </ul>\n                    </div>\n                </div>\n                <p class=\"more-footnote\">Client work is described by shape rather than by name. We don't put client brands, logos or data in our marketing — including in screenshots.</p>\n            </details>\n        </div>\n    </section>\n\n    <!-- PROCESS -->\n    <section class=\"section process\" id=\"process\">\n        <div class=\"container\">\n            <div class=\"section-header\">\n                <span class=\"section-tag\">How we work</span>\n                <h2>The same people, <em>from architecture to the 3am page</em></h2>\n                <p>No handoff between the team that designs it, the team that builds it, and the team that keeps it running — because there is only one team.</p>\n            </div>\n\n            <div class=\"process-steps\">\n                <div class=\"process-step\">\n                    <div class=\"step-num\">01</div>\n                    <div class=\"step-content\">\n                        <h3>Understand</h3>\n                        <p>We learn your business, your users, and what success looks like. No generic solutions — every build starts with the real problem.</p>\n                    </div>\n                </div>\n                <div class=\"process-step\">\n                    <div class=\"step-num\">02</div>\n                    <div class=\"step-content\">\n                        <h3>Architect</h3>\n                        <p>Pick the right stack for your needs. Design the database, map the features, plan the deployment. Get alignment before writing a single line.</p>\n                    </div>\n                </div>\n                <div class=\"process-step\">\n                    <div class=\"step-num\">03</div>\n                    <div class=\"step-content\">\n                        <h3>Build</h3>\n                        <p>Rapid, iterative development with AI-augmented workflows. You see working builds as we go — not a reveal at the end.</p>\n                    </div>\n                </div>\n                <div class=\"process-step\">\n                    <div class=\"step-num\">04</div>\n                    <div class=\"step-content\">\n                        <h3>Run it</h3>\n                        <p>Docker, CI/CD, staging and production on infrastructure we operate ourselves. We are the ones who get paged, which is why the monitoring is honest.</p>\n                    </div>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <!-- CTA / CONTACT -->\n    <section class=\"section contact\" id=\"contact\">\n        <div class=\"container\">\n            <div class=\"contact-card\">\n                <div class=\"contact-content\">\n                    <span class=\"section-tag\">Start a Project</span>\n                    <h2>What do you want to build?</h2>\n                    <p>Tell us about your idea — we'll get back to you within 24 hours with a plan.</p>\n                    <form id=\"ideaForm\" class=\"idea-form\">\n                        <div class=\"form-group\">\n                            <label for=\"ideaName\">Your Name</label>\n                            <input type=\"text\" id=\"ideaName\" placeholder=\"John Doe\" required>\n                        </div>\n                        <div class=\"form-group\">\n                            <label for=\"ideaEmail\">Email</label>\n                            <input type=\"email\" id=\"ideaEmail\" placeholder=\"you@company.com\" required>\n                        </div>\n                        <div class=\"form-group\">\n                            <label for=\"ideaProject\">Project Name <span style=\"color:var(--text-dim);font-weight:400\">(optional)</span></label>\n                            <input type=\"text\" id=\"ideaProject\" placeholder=\"My Awesome App\">\n                        </div>\n                        <div class=\"form-group\">\n                            <label for=\"ideaText\">Describe Your Idea</label>\n                            <textarea id=\"ideaText\" placeholder=\"I need an app that...\" rows=\"4\" required maxlength=\"2000\"></textarea>\n                        </div>\n                        <!-- hp -->\n                        <div style=\"position:absolute;left:-9999px;top:-9999px\" aria-hidden=\"true\">\n                            <input type=\"text\" name=\"website\" id=\"ideaWebsite\" tabindex=\"-1\" autocomplete=\"off\">\n                        </div>\n                        <button type=\"submit\" class=\"btn btn-primary\" id=\"ideaSubmitBtn\">Send It Over</button>\n                        <div id=\"ideaMsg\"></div>\n                    </form>\n                    <div class=\"contact-divider\"><span>or reach out directly</span></div>\n                    <div class=\"contact-methods\">\n                        <a href=\"https://wa.me/18623005027\" target=\"_blank\" rel=\"noopener\" class=\"contact-method\" data-track=\"contact-whatsapp\">\n                            <svg viewBox=\"0 0 24 24\" fill=\"currentColor\" width=\"24\" height=\"24\"><path d=\"M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z\"/></svg>\n                            <div>\n                                <span class=\"contact-label\">WhatsApp</span>\n                                <span class=\"contact-value\">Message us</span>\n                            </div>\n                        </a>\n                        <a href=\"mailto:hello@kaymen.dev\" class=\"contact-method\" data-track=\"contact-email\">\n                            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75\"/></svg>\n                            <div>\n                                <span class=\"contact-label\">Email</span>\n                                <span class=\"contact-value\">hello@kaymen.dev</span>\n                            </div>\n                        </a>\n                    </div>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <!-- FOOTER -->\n    <footer class=\"footer\">\n        <div class=\"container footer-inner\">\n            <div class=\"footer-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </div>\n            <div class=\"footer-links\">\n                <a href=\"/work\">Work</a>\n                <a href=\"#practice\">What we do</a>\n                <a href=\"#process\">Process</a>\n                <a href=\"#contact\">Contact</a>\n            </div>\n            <div class=\"footer-copy\">&copy; 2026 Kaymen Group LLC</div>\n        </div>\n    </footer>\n\n    <!--SCRIPT-->\n</body>\n</html>\n"},{"id":"work","label":"Work index","group":"Site","path":"/work","html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Work — kaymen.dev</title>\n    <meta name=\"description\" content=\"Six case studies: multi-tenant platforms, business-system integrations, and apps in the stores — each with the part that went wrong and how it was fixed.\">\n    <link rel=\"canonical\" href=\"https://kaymen.dev/work\">\n    <meta property=\"og:type\" content=\"website\">\n    <meta property=\"og:url\" content=\"https://kaymen.dev/work\">\n    <meta property=\"og:site_name\" content=\"kaymen.dev\">\n    <meta property=\"og:title\" content=\"Work — kaymen.dev\">\n    <meta property=\"og:description\" content=\"Six case studies: multi-tenant platforms, business-system integrations, and apps in the stores — each with the part that went wrong and how it was fixed.\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n    <meta name=\"twitter:title\" content=\"Work — kaymen.dev\">\n    <meta name=\"twitter:description\" content=\"Six case studies: multi-tenant platforms, business-system integrations, and apps in the stores — each with the part that went wrong and how it was fixed.\">\n    <meta name=\"theme-color\" content=\"#09090b\">\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n    <!--STYLE-->\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+DQogIDxkZWZzPg0KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMTAwJSI+DQogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjM2I4MmY2Ii8+DQogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM4YjVjZjYiLz4NCiAgICA8L2xpbmVhckdyYWRpZW50Pg0KICA8L2RlZnM+DQogIDxyZWN0IHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgcng9IjgiIGZpbGw9IiMwOTA5MGIiLz4NCiAgPHRleHQgeD0iNCIgeT0iMjMiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtd2VpZ2h0PSI3MDAiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9InVybCgjZykiPks8L3RleHQ+DQogIDxjaXJjbGUgY3g9IjI0IiBjeT0iMTAiIHI9IjMiIGZpbGw9InVybCgjZykiIG9wYWNpdHk9IjAuNiIvPg0KPC9zdmc+DQo=\">\n</head>\n<body>\n\n    <nav class=\"nav\" id=\"nav\">\n        <div class=\"nav-inner\">\n            <a href=\"/\" class=\"nav-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </a>\n            <div class=\"nav-links\" id=\"navLinks\">\n                <a href=\"/#work\" data-track=\"nav-work\">Work</a>\n                <a href=\"/#practice\" data-track=\"nav-practice\">What we do</a>\n                <a href=\"/#process\" data-track=\"nav-process\">Process</a>\n                <a href=\"/#contact\" class=\"nav-cta\" data-track=\"nav-contact\">Let's Talk</a>\n            </div>\n            <button class=\"theme-toggle\" id=\"themeToggle\" aria-label=\"Toggle theme\">\n                <svg class=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><circle cx=\"12\" cy=\"12\" r=\"5\"/><path d=\"M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\"/></svg>\n                <svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><path d=\"M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z\"/></svg>\n            </button>\n            <button class=\"nav-hamburger\" id=\"hamburger\" aria-label=\"Toggle menu\">\n                <span></span><span></span><span></span>\n            </button>\n        </div>\n    </nav>\n\n    <header class=\"work-hero\">\n        <div class=\"container\">\n            <span class=\"section-tag\">Selected work</span>\n            <h1>Six builds, and what was <em>hard</em> about each</h1>\n            <p>Each case study covers the problem, the constraints, what we built, and one specific thing that went wrong along the way. The last part is the one worth reading.</p>\n        </div>\n    </header>\n    <section class=\"section work work-index\">\n        <div class=\"container\">\n            <div class=\"study-grid\">\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/multi-campus-engagement-platform\" data-track=\"study-multi-campus-engagement-platform\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Platforms</span>\n                            <span class=\"study-status\">Live in production</span>\n                        </div>\n                        <h3>Multi-campus engagement platform</h3>\n                        <p class=\"study-tagline\">Four campuses, one database, isolation that had to be provably real.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">4</span><span class=\"scale-label\">campuses on one platform</span></div>\n                            <div><span class=\"scale-value\">135K</span><span class=\"scale-label\">lines of legacy code retired</span></div>\n                            <div><span class=\"scale-value\">2×/day</span><span class=\"scale-label\">Salesforce sync, zero duplicates</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">Row-level security that silently did nothing</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/community-lending-ledger\" data-track=\"study-community-lending-ledger\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Platforms</span>\n                            <span class=\"study-status\">Live in production</span>\n                        </div>\n                        <h3>Community lending ledger</h3>\n                        <p class=\"study-tagline\">A $1.58M interest-free loan fund whose headline number was wrong by $47,383.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">$1.58M</span><span class=\"scale-label\">fund reconciled to the bank</span></div>\n                            <div><span class=\"scale-value\">44</span><span class=\"scale-label\">lenders tracked individually</span></div>\n                            <div><span class=\"scale-value\">$47K</span><span class=\"scale-label\">previously-unexplained gap, resolved</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">The headline number was measuring the wrong side</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/msp-time-compliance-portal\" data-track=\"study-msp-time-compliance-portal\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Integrations</span>\n                            <span class=\"study-status\">Live in production</span>\n                        </div>\n                        <h3>MSP time-compliance portal</h3>\n                        <p class=\"study-tagline\">Billable hours were leaking. The API could not answer the question being asked.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">20,920</span><span class=\"scale-label\">tickets under delta sync</span></div>\n                            <div><span class=\"scale-value\">5,216</span><span class=\"scale-label\">time entries reconciled</span></div>\n                            <div><span class=\"scale-value\">10 min</span><span class=\"scale-label\">refresh interval</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">Designing around an API that cannot answer the question</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/bilingual-booking-platform\" data-track=\"study-bilingual-booking-platform\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Apps</span>\n                            <span class=\"study-status\">Live in production</span>\n                        </div>\n                        <h3>Bilingual therapeutic-riding booking platform</h3>\n                        <p class=\"study-tagline\">The booking calendar rendered perfectly, and it was empty.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">HE / EN</span><span class=\"scale-label\">full RTL and LTR</span></div>\n                            <div><span class=\"scale-value\">30 days</span><span class=\"scale-label\">rolling bookable horizon</span></div>\n                            <div><span class=\"scale-value\">0</span><span class=\"scale-label\">errors when it broke</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">A failure mode with no error state</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/torah-tracker\" data-track=\"study-torah-tracker\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Apps</span>\n                            <span class=\"study-status\">Live — App Store &amp; Google Play</span>\n                        </div>\n                        <h3>Torah Tracker</h3>\n                        <p class=\"study-tagline\">A rewrite shipped to an installed base, without reaching zero users.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">iOS + Android</span><span class=\"scale-label\">native, in both stores</span></div>\n                            <div><span class=\"scale-value\">OTA</span><span class=\"scale-label\">updates without a store round-trip</span></div>\n                            <div><span class=\"scale-value\">0</span><span class=\"scale-label\">users a mismatched update reaches</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">The update that publishes successfully to nobody</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n                <article class=\"study-card\">\n                    <a class=\"study-card-link\" href=\"/work/claude-code-desk\" data-track=\"study-claude-code-desk\">\n                        <div class=\"study-card-head\">\n                            <span class=\"study-area\">Platforms</span>\n                            <span class=\"study-status\">Live — desktop app + installable PWA</span>\n                        </div>\n                        <h3>Claude Code Desk &amp; Mobile</h3>\n                        <p class=\"study-tagline\">The internal tool the rest of this portfolio is built in.</p>\n                        <div class=\"study-scale\">\n                            <div><span class=\"scale-value\">25+</span><span class=\"scale-label\">projects driven from one interface</span></div>\n                            <div><span class=\"scale-value\">Desktop + PWA</span><span class=\"scale-label\">same session, either device</span></div>\n                            <div><span class=\"scale-value\">Push</span><span class=\"scale-label\">notified when a run needs input</span></div>\n                        </div>\n                        <div class=\"study-hard has-demo\">\n                            <span class=\"study-hard-tag\">The hard part — playable</span>\n                            <span class=\"study-hard-title\">The identifier you need is not where the event is</span>\n                        </div>\n                        <span class=\"study-more\">Try it\n                            <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z\"/></svg>\n                        </span>\n                    </a>\n                </article>\n            </div>\n        </div>\n    </section>\n    \n    <section class=\"section more-work\" id=\"more\">\n        <div class=\"container\">\n            <details class=\"more-toggle\">\n                <summary>\n                    <span class=\"more-summary-text\">Everything else we've built</span>\n                    <span class=\"more-count\">12 more projects</span>\n                </summary>\n                <div class=\"more-grid\">\n                    <div class=\"more-col\">\n                        <h4>Multi-tenant platforms</h4>\n                        <ul>\n                            <li><span class=\"more-name\">Mortgage client portal</span><span class=\"more-note\">Application intake, document vault, broker pipeline</span></li>\n                            <li><span class=\"more-name\">Campus site builder</span><span class=\"more-note\">Drag-and-drop public sites, multi-tenant</span></li>\n                            <li><span class=\"more-name\"><a href=\"/portal\">Client project portal</a></span><span class=\"more-note\">Milestones, tickets and plan approval — this site runs it</span></li>\n                        </ul>\n                    </div>\n                    <div class=\"more-col\">\n                        <h4>Business systems &amp; integrations</h4>\n                        <ul>\n                            <li><span class=\"more-name\">Predictable</span><span class=\"more-note\">Stock curation &amp; analysis, live broker integration</span></li>\n                            <li><span class=\"more-name\">Same-day delivery network</span><span class=\"more-note\">Multi-carrier rate-shop injected into checkout</span></li>\n                            <li><span class=\"more-name\">Warehouse operations assistant</span><span class=\"more-note\">Natural-language interface over 3PL operations</span></li>\n                        </ul>\n                    </div>\n                    <div class=\"more-col\">\n                        <h4>Consumer &amp; mobile apps</h4>\n                        <ul>\n                            <li><span class=\"more-name\"><a href=\"https://davenen.org\" target=\"_blank\" rel=\"noopener\">Davenen</a><span class=\"more-badge\">App Store</span></span><span class=\"more-note\">Prayer-partner matching platform</span></li>\n                            <li><span class=\"more-name\"><a href=\"https://kartov.app\" target=\"_blank\" rel=\"noopener\">Kartov</a></span><span class=\"more-note\">Shared lists &amp; meal planning</span></li>\n                            <li><span class=\"more-name\">Temani Chacham<span class=\"more-badge\">App Store</span></span><span class=\"more-note\">Yemenite siddur with a rule-driven prayer engine</span></li>\n                            <li><span class=\"more-name\">TapSend</span><span class=\"more-note\">Bulk messaging with a manual send gate</span></li>\n                            <li><span class=\"more-name\">Investment firm site</span><span class=\"more-note\">Marketing site and content platform</span></li>\n                            <li><span class=\"more-name\">Advocacy campaign platform</span><span class=\"more-note\">Hebrew-first campaign site with media pipeline</span></li>\n                        </ul>\n                    </div>\n                </div>\n                <p class=\"more-footnote\">Client work is described by shape rather than by name. We don't put client brands, logos or data in our marketing — including in screenshots.</p>\n            </details>\n        </div>\n    </section>\n    \n    <section class=\"section cta-band\">\n        <div class=\"container\">\n            <div class=\"cta-band-inner\">\n                <h2>Want the same treatment on your problem?</h2>\n                <p>The first conversation is us working out whether this is a build, a fix, or something you should not do at all.</p>\n                <div class=\"cta-band-actions\">\n                    <a href=\"/#contact\" class=\"btn btn-primary\" data-track=\"cta-band-contact\">Start a conversation</a>\n                    <a href=\"/work\" class=\"btn btn-secondary\" data-track=\"cta-band-work\">See more work</a>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <footer class=\"footer\">\n        <div class=\"container footer-inner\">\n            <div class=\"footer-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </div>\n            <div class=\"footer-links\">\n                <a href=\"/work\">Work</a>\n                <a href=\"/#practice\">What we do</a>\n                <a href=\"/#contact\">Contact</a>\n            </div>\n            <div class=\"footer-copy\">&copy; 2026 Kaymen Group LLC</div>\n        </div>\n    </footer>\n    <!--SCRIPT-->\n</body>\n</html>"},{"id":"multi-campus-engagement-platform","label":"Multi-campus engagement platform","group":"Platforms","path":"/work/multi-campus-engagement-platform","html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Multi-campus engagement platform — kaymen.dev</title>\n    <meta name=\"description\" content=\"Four campuses, one database, isolation that had to be provably real.\">\n    <link rel=\"canonical\" href=\"https://kaymen.dev/work/multi-campus-engagement-platform\">\n    <meta property=\"og:type\" content=\"article\">\n    <meta property=\"og:url\" content=\"https://kaymen.dev/work/multi-campus-engagement-platform\">\n    <meta property=\"og:site_name\" content=\"kaymen.dev\">\n    <meta property=\"og:title\" content=\"Multi-campus engagement platform — kaymen.dev\">\n    <meta property=\"og:description\" content=\"Four campuses, one database, isolation that had to be provably real.\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n    <meta name=\"twitter:title\" content=\"Multi-campus engagement platform — kaymen.dev\">\n    <meta name=\"twitter:description\" content=\"Four campuses, one database, isolation that had to be provably real.\">\n    <meta name=\"theme-color\" content=\"#09090b\">\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n    <!--STYLE-->\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+DQogIDxkZWZzPg0KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMTAwJSI+DQogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjM2I4MmY2Ii8+DQogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM4YjVjZjYiLz4NCiAgICA8L2xpbmVhckdyYWRpZW50Pg0KICA8L2RlZnM+DQogIDxyZWN0IHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgcng9IjgiIGZpbGw9IiMwOTA5MGIiLz4NCiAgPHRleHQgeD0iNCIgeT0iMjMiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtd2VpZ2h0PSI3MDAiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9InVybCgjZykiPks8L3RleHQ+DQogIDxjaXJjbGUgY3g9IjI0IiBjeT0iMTAiIHI9IjMiIGZpbGw9InVybCgjZykiIG9wYWNpdHk9IjAuNiIvPg0KPC9zdmc+DQo=\">\n</head>\n<body>\n\n    <nav class=\"nav\" id=\"nav\">\n        <div class=\"nav-inner\">\n            <a href=\"/\" class=\"nav-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </a>\n            <div class=\"nav-links\" id=\"navLinks\">\n                <a href=\"/#work\" data-track=\"nav-work\">Work</a>\n                <a href=\"/#practice\" data-track=\"nav-practice\">What we do</a>\n                <a href=\"/#process\" data-track=\"nav-process\">Process</a>\n                <a href=\"/#contact\" class=\"nav-cta\" data-track=\"nav-contact\">Let's Talk</a>\n            </div>\n            <button class=\"theme-toggle\" id=\"themeToggle\" aria-label=\"Toggle theme\">\n                <svg class=\"icon-sun\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><circle cx=\"12\" cy=\"12\" r=\"5\"/><path d=\"M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42\"/></svg>\n                <svg class=\"icon-moon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" width=\"18\" height=\"18\"><path d=\"M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z\"/></svg>\n            </button>\n            <button class=\"nav-hamburger\" id=\"hamburger\" aria-label=\"Toggle menu\">\n                <span></span><span></span><span></span>\n            </button>\n        </div>\n    </nav>\n\n    <article class=\"case\">\n        <header class=\"case-hero\">\n            <div class=\"container case-narrow\">\n                <a class=\"case-back\" href=\"/work\" data-track=\"case-back\">\n                    <svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><path fill-rule=\"evenodd\" d=\"M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z\"/></svg>\n                    All work\n                </a>\n                <div class=\"case-meta\">\n                    <span class=\"case-area\">Multi-tenant platforms</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-status\">Live in production</span>\n                    <span class=\"case-dot\">·</span>\n                    <span class=\"case-year\">2026</span>\n                </div>\n                <h1>Multi-campus engagement platform</h1>\n                <p class=\"case-tagline\">Four campuses, one database, isolation that had to be provably real.</p>\n                <p class=\"case-summary\">A network of campus organisations ran on a 135,000-line WordPress plugin — one install per campus, student records duplicated across sites, no shared reporting, and a Salesforce org nobody trusted. We replaced it with a single multi-tenant platform.</p>\n                \n                <div class=\"case-scale\">\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">4</span>\n                        <span class=\"case-scale-label\">campuses on one platform</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">135K</span>\n                        <span class=\"case-scale-label\">lines of legacy code retired</span>\n                    </div>\n                    <div class=\"case-scale-item\">\n                        <span class=\"case-scale-value\">2×/day</span>\n                        <span class=\"case-scale-label\">Salesforce sync, zero duplicates</span>\n                    </div>\n                </div>\n            </div>\n        </header>\n\n        <div class=\"container case-narrow case-body\">\n            <figure class=\"demo\" data-demo=\"rls\">\n    <figcaption class=\"demo-head\">\n        <span class=\"demo-tag\">Interactive — try it</span>\n        <h3 class=\"demo-title\">Same query. Two database roles.</h3>\n        <p class=\"demo-kicker\">The application never changed. Only the credential it connects with did.</p>\n    </figcaption>\n    <div class=\"demo-body\">\n    <div class=\"demo-switch\" role=\"group\" aria-label=\"Database role\">\n        <button type=\"button\" data-role=\"super\" aria-pressed=\"true\">\n            <span class=\"sw-name\">thrive</span><span class=\"sw-sub\">bootstrap superuser</span>\n        </button>\n        <button type=\"button\" data-role=\"app\" aria-pressed=\"false\">\n            <span class=\"sw-name\">thrive_app</span><span class=\"sw-sub\">non-superuser</span>\n        </button>\n    </div>\n\n    <div class=\"demo-console\">\n        <div class=\"demo-console-bar\">\n            <span class=\"dot r\"></span><span class=\"dot y\"></span><span class=\"dot g\"></span>\n            <span class=\"demo-console-title\">psql — request scoped to Campus A</span>\n        </div>\n        <pre class=\"demo-sql\"><span class=\"c\">-- policy: students.org_id = current_setting('app.current_org_id')</span>\n<span class=\"c\">-- table has ENABLE + FORCE ROW LEVEL SECURITY</span>\n<span class=\"k\">SELECT</span> name, campus <span class=\"k\">FROM</span> students <span class=\"k\">LIMIT</span> 8;</pre>\n        <div class=\"demo-facts\">\n            <span><em>current_user</em> <code data-out=\"user\">thrive</code></span>\n            <span><em>rolsuper</em> <code data-out=\"rolsuper\">true</code></span>\n            <span><em>rows</em> <code data-out=\"count\">8</code></span>\n        </div>\n        <table class=\"demo-table\"><tbody data-out=\"rows\"></tbody></table>\n    </div>\n\n    <div class=\"demo-verdict\" data-out=\"verdict\"></div></div>\n    <p class=\"demo-caption\">The managed Postgres made the app’s user the cluster’s bootstrap superuser, and superusers bypass row-level security unconditionally — <code>FORCE ROW LEVEL SECURITY</code> does not apply to them. Every policy was correct. Nothing errored. Isolation was simply off. The bootstrap user cannot be demoted, so the fix was a second role owning every table.</p>\n</figure>\n\n            <section class=\"case-glance\">\n                <div class=\"glance-col\">\n                    <h2>The problem</h2>\n                    <ul class=\"glance-list\"><li>One WordPress install per campus — the same student existing three times with three histories.</li><li>No way to answer any question across the network without exporting three spreadsheets.</li><li>Salesforce was the system of record, fed by manual weekly CSVs that were stale on arrival.</li></ul>\n                </div>\n                <div class=\"glance-col\">\n                    <h2>What we built</h2>\n                    <ul class=\"glance-list glance-check\"><li>A single Laravel + Filament platform on one Postgres database, with per-campus tenancy enforced by row-level security.</li><li>A per-campus admin panel, plus a cross-campus HQ panel for the parent organisation — the same data, two scopes, one permission model.</li><li>A drag-and-drop public site builder so each campus runs its own public-facing site out of the same platform.</li><li>Two-way Salesforce sync built on bridge objects, with flow deployment via the Metadata API.</li></ul>\n                </div>\n            </section>\n\n            <section class=\"case-outcome\">\n                <h2>Outcome</h2>\n                <ul class=\"case-list case-list-check\"><li>Four campuses live on one platform; the legacy plugin retired.</li><li>Salesforce syncing twice daily across all campuses, zero failures and zero duplicate contacts on cutover.</li><li>The mobile app moved onto the new backend without a forced update.</li><li>Cross-network reporting that previously required three exports and a spreadsheet is now a page.</li></ul>\n                <div class=\"case-stack\">\n                    <span>Laravel 13</span><span>Filament 5</span><span>PostgreSQL + RLS</span><span>Livewire 4</span><span>React Native</span><span>Salesforce REST + Metadata API</span>\n                </div>\n            </section>\n\n            <details class=\"case-longform\">\n                <summary>\n                    <span class=\"lf-title\">The full write-up</span>\n                    <span class=\"lf-sub\">problem, constraints, and the whole debugging story — about a 4-minute read</span>\n                </summary>\n                <div class=\"lf-body\">\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">01</span> The problem</h3>\n                        <p>Each campus ran its own copy of a large WordPress plugin. The same student could exist three times across three installs with three different histories, and there was no way to answer a question across the network — headcount, attendance, engagement — without exporting three spreadsheets and reconciling them by hand.</p>\n                        <p>The parent organisation treated Salesforce as the system of record, but the data reaching it came from manual weekly CSV exports. By the time anyone looked, it was stale and partly wrong.</p>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">02</span> Constraints</h3>\n                        <ul class=\"case-list\"><li>Real student PII across every campus — the isolation story had to be provable, not asserted.</li><li>The old system stayed live throughout. There was no maintenance window and no cutover weekend.</li><li>A native mobile app was already in the App Store with installed users. It had to keep working, on the same binary, while the backend underneath it changed completely.</li><li>Salesforce had to stay in sync in both directions, without creating duplicate contacts in an org with an active duplicate-detection rule.</li></ul>\n                    </section>\n                    <section class=\"case-section\">\n                        <h3><span class=\"case-num\">03</span> What we built</h3>\n                        <ul class=\"case-list case-list-check\"><li>A single Laravel + Filament platform on one Postgres database, with per-campus tenancy enforced by row-level security.</li><li>A per-campus admin panel, plus a cross-campus HQ panel for the parent organisation — the same data, two scopes, one permission model.</li><li>A drag-and-drop public site builder so each campus runs its own public-facing site out of the same platform.</li><li>Two-way Salesforce sync built on bridge objects, with flow deployment via the Metadata API.</li><li>A read-only AI admin assistant, walled off from writes at the database layer.</li><li>The v2 API the existing mobile app now runs against.</li></ul>\n                    </section>\n                    <section class=\"case-section case-hard\">\n                        <div class=\"case-hard-tag\">The hard part, in full</div>\n                        <h3>Row-level security that silently did nothing</h3>\n                        <p>Tenant isolation was designed on Postgres row-level security: every tenant table gets a policy, the request sets the current organisation, the database refuses to return anyone else&#39;s rows. Policies were in place. The tests passed. And one campus could still have read another&#39;s students.</p>\n                        <p>The managed Postgres had provisioned the application&#39;s database user as the cluster&#39;s <strong>bootstrap superuser</strong>. Superusers bypass row-level security unconditionally — <code>FORCE ROW LEVEL SECURITY</code> does not apply to them. And the bootstrap user cannot be demoted; Postgres refuses. So the entire isolation layer was inert, and nothing about the running application looked wrong.</p>\n                        <p>The fix was a separate non-superuser role, with ownership of every table and sequence in the schema reassigned to it, and the application moved onto it. <code>current_user</code> is now asserted on boot, because a future deploy that quietly reverts the credential would turn tenant isolation back off without a single error.</p>\n                        <p>Then the same property bit from the other direction. A migration backfilling a new column looped over an existing table and wrote nothing — it ran under row-level security with no bypass active, so the read returned zero rows and the loop did nothing, successfully. 152 student records went blank and the migration reported success. Anything crossing tenants now has to say so explicitly.</p>\n                        <aside class=\"case-lesson\">\n                            <span class=\"case-lesson-label\">What it taught us</span>\n                            <p>A security control that fails open is worse than one you never built, because it also buys you confidence. Both bugs here were silent successes — the check that catches them is asserting the precondition at runtime, not testing the behaviour once.</p>\n                        </aside>\n                    </section>\n                </div>\n            </details>\n        </div>\n\n        \n        <nav class=\"case-nav\">\n            <div class=\"container case-narrow case-nav-inner\">\n                <a class=\"case-nav-item prev\" href=\"/work/claude-code-desk\">\n                    <span class=\"case-nav-dir\">Previous</span>\n                    <span class=\"case-nav-name\">Claude Code Desk &amp; Mobile</span>\n                </a>\n                <a class=\"case-nav-item next\" href=\"/work/community-lending-ledger\">\n                    <span class=\"case-nav-dir\">Next</span>\n                    <span class=\"case-nav-name\">Community lending ledger</span>\n                </a>\n            </div>\n        </nav>\n    </article>\n    \n    <section class=\"section cta-band\">\n        <div class=\"container\">\n            <div class=\"cta-band-inner\">\n                <h2>Got something shaped like this?</h2>\n                <p>Tell us what it is and what has stopped working. We will tell you what we would build.</p>\n                <div class=\"cta-band-actions\">\n                    <a href=\"/#contact\" class=\"btn btn-primary\" data-track=\"cta-band-contact\">Start a conversation</a>\n                    <a href=\"/work\" class=\"btn btn-secondary\" data-track=\"cta-band-work\">See more work</a>\n                </div>\n            </div>\n        </div>\n    </section>\n\n    <footer class=\"footer\">\n        <div class=\"container footer-inner\">\n            <div class=\"footer-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </div>\n            <div class=\"footer-links\">\n                <a href=\"/work\">Work</a>\n                <a href=\"/#practice\">What we do</a>\n                <a href=\"/#contact\">Contact</a>\n            </div>\n            <div class=\"footer-copy\">&copy; 2026 Kaymen Group LLC</div>\n        </div>\n    </footer>\n    <!--SCRIPT-->\n</body>\n</html>"},{"id":"community-lending-ledger","label":"Community lending ledger","group":"Platforms","path":"/work/community-lending-ledger","html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Community lending ledger — kaymen.dev</title>\n    <meta name=\"description\" content=\"A $1.58M interest-free loan fund whose headline number was wrong by $47,383.\">\n    <link rel=\"canonical\" href=\"https://kaymen.dev/work/community-lending-ledger\">\n    <meta property=\"og:type\" content=\"article\">\n    <meta property=\"og:url\" content=\"https://kaymen.dev/work/community-lending-ledger\">\n    <meta property=\"og:site_name\" content=\"kaymen.dev\">\n    <meta property=\"og:title\" content=\"Community lending ledger — kaymen.dev\">\n    <meta property=\"og:description\" content=\"A $1.58M interest-free loan fund whose headline number was wrong by $47,383.\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n    <meta name=\"twitter:title\" content=\"Community lending ledger — kaymen.dev\">\n    <meta name=\"twitter:description\" content=\"A $1.58M interest-free loan fund whose headline number was wrong by $47,383.\">\n    <meta name=\"theme-color\" content=\"#09090b\">\n    <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n    <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n    <!--STYLE-->\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+DQogIDxkZWZzPg0KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZyIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMTAwJSI+DQogICAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjM2I4MmY2Ii8+DQogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiM4YjVjZjYiLz4NCiAgICA8L2xpbmVhckdyYWRpZW50Pg0KICA8L2RlZnM+DQogIDxyZWN0IHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgcng9IjgiIGZpbGw9IiMwOTA5MGIiLz4NCiAgPHRleHQgeD0iNCIgeT0iMjMiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtd2VpZ2h0PSI3MDAiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9InVybCgjZykiPks8L3RleHQ+DQogIDxjaXJjbGUgY3g9IjI0IiBjeT0iMTAiIHI9IjMiIGZpbGw9InVybCgjZykiIG9wYWNpdHk9IjAuNiIvPg0KPC9zdmc+DQo=\">\n</head>\n<body>\n\n    <nav class=\"nav\" id=\"nav\">\n        <div class=\"nav-inner\">\n            <a href=\"/\" class=\"nav-logo\">\n                <span class=\"logo-bracket\">{</span> kaymen<span class=\"logo-dot\">.</span>dev <span class=\"logo-bracket\">}</span>\n            </a>\n            <div class=\"nav-links\" id=\"navLinks\">\n                <a href=\"/#work\" data-track=\"nav-work\">Work</a>\n                <a href=\"/#practice\" data-track=\"nav-practice\">What we do</a>\n                <a href=\"/#process\" data-track=\"nav-process\">Process</a>\n                <a href=\"/#contact\" class=\"nav-cta\" data-track=\"nav-contact\">Let's Talk</a>\n            </div>\n            <button class=\"theme-toggle\" id=\"themeToggle\" aria-label=\"Toggle theme\">\n                <svg cla
